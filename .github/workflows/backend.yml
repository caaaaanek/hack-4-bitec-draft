name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imd_test
          POSTGRES_USER: imd
          POSTGRES_PASSWORD: imd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imd -d imd_test" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-secret-not-for-production-0123456789abcdef
      DEMO_PASSWORD: ci-demo-pass
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Тести на SQLite
        run: pytest -q
      - name: Тести на PostgreSQL (зокрема перевірка xmin)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://imd:imd@localhost:5432/imd_test
        run: pytest -q
      - name: Міграції з нуля і відповідність моделям
        env:
          DATABASE_URL: postgresql+psycopg://imd:imd@localhost:5432/imd_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://imd:imd@localhost:5432/imd_test")
          with e.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public"))
          PY
          alembic upgrade head
          python -m app.seed.seed
          python - <<'PY'
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from app.db import Base, engine
          import app.models  # noqa: F401
          with engine.connect() as c:
              diff = compare_metadata(MigrationContext.configure(c), Base.metadata)
          assert not diff, diff
          print("міграції відповідають моделям")
          PY
