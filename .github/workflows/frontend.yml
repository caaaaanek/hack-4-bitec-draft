name: frontend

on:
  push:
    paths: ["frontend-proto/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend-proto/**", ".github/workflows/frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-proto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-proto/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Збірка (Vite)
        run: npm run build
