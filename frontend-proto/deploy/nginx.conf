# frontend-proto + зворотний проксі до API. Шаблон: при старті контейнера підставляється ${BACKEND_URL}.
# Сторінка й /api на одному origin: CORS не задіяний, токен сесії — у заголовку Authorization.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Найбільший легітимний запит — файл-доказ (EVIDENCE_MAX_BYTES, за замовчуванням 10 МБ).
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Закритий контур: жодних зовнішніх джерел. Скрипти лише з /assets (збірка Vite), inline-скриптів немає;
    # style-src дозволяє inline, бо React задає атрибути style.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Заголовки входу через проксі організації не можна передати з браузера: стираємо.
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Proxy-Secret "";
        # Асистент на локальній моделі може думати довго.
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass ${BACKEND_URL}/health;
        access_log off;
    }

    # Одноразові посилання /s/<токен>: та сама сторінка, без запису в журнал nginx.
    location /s/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        # add_header у location скасовує успадкування заголовків server: повторюємо їх, інакше сторінка без CSP і X-Frame-Options
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    # QR для зали /q/<код>: та сама сторінка, без запису в журнал nginx (токен видає POST із самої сторінки).
    location /q/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    # Збірка Vite: імена файлів містять хеш, тож їх можна кешувати назавжди.
    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location /fonts/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
