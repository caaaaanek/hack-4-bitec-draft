<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrity Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — белый сайдбар + рабочая область с сеткой карточек; drawer справа */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --soft: #f2f3f5; --line: #e8eaee;
  --fg: #111418; --muted: #5e6570; --faint: #c3c7ce;
  --lime: #9be07a; --lime-ink: #10290f; --lime-soft: #e8f7df;
  --teal: #1db58f; --teal-deep: #2f7d68; --teal-soft: #dcf3eb; --teal-pale: #c9ead9;
  --amber: #d98f1e; --amber-soft: #fbefd9;
  --red: #e0554a; --red-soft: #fce5e2;
  --blue: #5a8dee; --blue-soft: #e3ecfd;
  --tip: #111418; --tip-ink: #ffffff;
  --shadow: 0 1px 2px rgba(17,20,24,.04), 0 8px 24px rgba(17,20,24,.06);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121d; --panel: #141a27; --soft: #1b2232; --line: #242c3d;
    --fg: #eef1f6; --muted: #8b93a5; --faint: #4b5367;
    --lime: #a8e88a; --lime-ink: #0d230d; --lime-soft: #1d2f1f;
    --teal: #2cc9a0; --teal-deep: #4fae93; --teal-soft: #15302a; --teal-pale: #1d4a3e;
    --amber: #f0b453; --amber-soft: #33281a; --red: #f07f75; --red-soft: #3a1f1f;
    --blue: #7ea6f5; --blue-soft: #1c2740;
    --tip: #eef1f6; --tip-ink: #0d121d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121d; --panel: #141a27; --soft: #1b2232; --line: #242c3d;
  --fg: #eef1f6; --muted: #8b93a5; --faint: #4b5367;
  --lime: #a8e88a; --lime-ink: #0d230d; --lime-soft: #1d2f1f;
  --teal: #2cc9a0; --teal-deep: #4fae93; --teal-soft: #15302a; --teal-pale: #1d4a3e;
  --amber: #f0b453; --amber-soft: #33281a; --red: #f07f75; --red-soft: #3a1f1f;
  --blue: #7ea6f5; --blue-soft: #1c2740;
  --tip: #eef1f6; --tip-ink: #0d121d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* Shell */
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100%; }
.side {
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 22px 16px; display: flex; flex-direction: column; gap: 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--lime); display: grid; place-items: center; color: var(--lime-ink); }
.search { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 12px; padding: 9px 12px; color: var(--muted); }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; }
.kbd { font-size: 11px; background: var(--panel); border-radius: 6px; padding: 2px 6px; color: var(--fg); box-shadow: var(--shadow); }
.nav-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 10px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
  color: var(--muted); text-decoration: none; font-weight: 500; position: relative;
  transition: background .2s, color .2s;
}
.nav a:hover { color: var(--fg); background: var(--soft); }
.nav a.on { color: var(--fg); background: var(--soft); }
.nav a .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--red-soft); color: var(--red); border-radius: 999px; padding: 1px 7px; }
.nav svg { width: 19px; height: 19px; flex: none; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.role-card { background: var(--soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.role-card small { color: var(--muted); }
.role-card select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  display: flex; align-items: center; gap: 12px; padding: 18px 28px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
}
.top h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.top .sp { flex: 1; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
  border-radius: 999px; padding: 8px 14px; font-weight: 500; white-space: nowrap;
}
.pill-btn svg { width: 16px; height: 16px; }
.pill-btn.lime { background: var(--lime-soft); border-color: transparent; color: var(--fg); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--teal-soft); color: var(--teal-deep); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.menu-btn { display: none; }
.synthetic { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 4px 10px; }

.view {
  padding: 4px 28px 48px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-content: start;
}
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; position: relative; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; }
.c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card-h .sp { flex: 1; }
.lbl { color: var(--muted); font-size: 13px; }
.big { font-size: 52px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.mid { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; }
.dec { color: var(--faint); }

/* Pills / chips */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.nodot::before { display: none; }
.p-good { background: var(--teal-soft); color: var(--teal-deep); }
.p-warn { background: var(--amber-soft); color: var(--amber); }
.p-bad { background: var(--red-soft); color: var(--red); }
.p-info { background: var(--blue-soft); color: var(--blue); }
.p-mute { background: var(--soft); color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.delta i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; }
.delta.up i { background: var(--teal); color: #fff; }
.delta.down i { background: var(--red); color: #fff; }
.delta b { color: var(--fg); font-weight: 600; }
.delta svg { width: 12px; height: 12px; }

.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--lime); color: var(--lime-ink); }
.btn-primary:hover { filter: brightness(1.04); }
.btn-soft { background: var(--soft); }
.btn-ghost { background: transparent; border: 1px solid var(--line); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn:disabled { opacity: .5; cursor: default; }

/* Seg control */
.seg { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; font-weight: 500; color: var(--muted); transition: background .2s, color .2s; }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: stretch; }
.hero-l { display: flex; flex-direction: column; gap: 14px; }
.levelbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: auto; }
.levelbar div { display: flex; flex-direction: column; gap: 6px; }
.levelbar .tk { display: flex; gap: 2px; height: 26px; align-items: flex-end; }
.levelbar .tk span { flex: 1; border-radius: 2px; background: var(--line); height: 100%; transform-origin: bottom; }
.levelbar .tk span.f { background: var(--teal); }
.levelbar .tk span.cur { background: var(--teal-deep); }
.levelbar small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.levelbar .here small { color: var(--fg); font-weight: 600; }

.part-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.ticks { display: flex; gap: 2px; height: 20px; align-items: stretch; grid-column: 1 / -1; }
.ticks span { flex: 1; border-radius: 2px; background: var(--line); }
.ticks span.f { background: var(--lime); }
.ticks span.f2 { background: var(--teal); }

/* Component cards */
.comp-top { display: flex; align-items: center; gap: 10px; }
.comp-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.comp-ic svg { width: 17px; height: 17px; }
.matrix { display: flex; gap: 4px; align-items: flex-end; height: 44px; }
.matrix .col { display: flex; flex-direction: column-reverse; gap: 3px; }
.matrix .col i { width: 9px; height: 6px; border-radius: 2px; background: var(--line); }
.matrix .col i.f { background: var(--teal); }
.matrix .col i.fw { background: var(--amber); }
.matrix .col i.fb { background: var(--red); }

/* Lists */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { color: var(--muted); font-size: 12px; }
.row.click { cursor: pointer; border-radius: 10px; transition: background .2s; padding-left: 8px; padding-right: 8px; margin: 0 -8px; }
.row.click:hover { background: var(--soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 12px; background: var(--soft); white-space: nowrap; }
th:first-child { border-radius: 10px 0 0 10px; } th:last-child { border-radius: 0 10px 10px 0; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .2s; }
tbody tr:hover { background: color-mix(in srgb, var(--lime-soft) 55%, transparent); }
td select, .inp { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--panel); max-width: 100%; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.ax { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.ax-strong { fill: var(--fg); font-size: 13px; font-weight: 600; font-family: var(--font); }
.grid-l { stroke: var(--line); stroke-dasharray: 3 4; }
.area-fill { fill: url(#gArea); }
.line-teal { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.step-fill { fill: url(#hatch); }
.step-line { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-linejoin: round; }
.col-hl { fill: var(--lime-soft); opacity: 0; transition: opacity .25s; }
.col-hl.on { opacity: 1; }
.bar-a { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
.draw { animation: draw 1.2s cubic-bezier(.3,.7,.2,1) both; }
.reveal { transform-box: fill-box; transform-origin: left; animation: revealx 1.1s cubic-bezier(.3,.7,.2,1) both; }
.radar-grid { fill: none; stroke: var(--line); }
.radar-ax { stroke: var(--line); }
.r-wg { fill: color-mix(in srgb, var(--blue) 14%, transparent); stroke: var(--blue); stroke-width: 2; }
.r-st { fill: color-mix(in srgb, var(--teal) 16%, transparent); stroke: var(--teal); stroke-width: 2; }
.r-f { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 4 4; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: var(--len, 1000); } to { stroke-dashoffset: 0; } }
@keyframes revealx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.tip {
  position: fixed; z-index: 100; pointer-events: none; background: var(--tip); color: var(--tip-ink);
  font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 9px; transform: translate(-50%, calc(-100% - 12px));
  opacity: 0; transition: opacity .15s; white-space: nowrap;
}
.tip.on { opacity: 1; }
.tip small { font-weight: 400; opacity: .7; display: block; }

/* Indicator bars (spending style) */
.ibars { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; align-items: end; height: 220px; }
.ibar { display: flex; flex-direction: column; align-items: stretch; gap: 8px; height: 100%; justify-content: flex-end; cursor: pointer; }
.ibar .b { border-radius: 12px; position: relative; transform-origin: bottom; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; transition: filter .2s; }
.ibar .b::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 7px; height: 6px; border-radius: 4px; background: rgba(255,255,255,.85); }
.ibar:hover .b, .ibar.sel .b { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 2px, transparent 2px 7px) !important; filter: saturate(1.1); }
.ibar .v { text-align: center; font-weight: 600; font-size: 13px; }
.ibar .n { text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Dumbbell */
.db { display: grid; grid-template-columns: 190px 1fr 54px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.db:first-of-type { border-top: 0; }
.db .track { position: relative; height: 22px; }
.db .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); border-radius: 2px; }
.db .gap { position: absolute; top: calc(50% - 3px); height: 6px; border-radius: 3px; background: var(--amber-soft); transform-origin: left; animation: revealx .9s both; }
.db .gap.bad { background: var(--red-soft); }
.db .m { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--panel); animation: pop .6s both; }
.db .m.wg { background: var(--blue); } .db .m.st { background: var(--teal); }
.db .m.f { background: var(--fg); border-radius: 3px; transform: rotate(45deg); width: 12px; height: 12px; margin: -6px 0 0 -6px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.kpi .ring { display: flex; align-items: center; gap: 10px; }

/* Recs */
.rec { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; padding: 16px; border: 1px solid var(--line); border-radius: 14px; transition: border-color .2s, transform .2s, box-shadow .2s; background: var(--panel); }
.rec:hover { border-color: var(--teal-pale); box-shadow: var(--shadow); }
.rec .pri { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; }
.rec h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.why span { font-size: 12px; background: var(--soft); border-radius: 8px; padding: 4px 8px; color: var(--muted); }
.why span b { color: var(--fg); font-weight: 600; }
.rec-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.recs { display: flex; flex-direction: column; gap: 10px; }
.rec.leaving { animation: leave .4s forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(40px); } }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(13,18,29,.32); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 60; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); z-index: 70;
  border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(0,0,0,.12);
  transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.on { transform: none; }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer-h h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.drawer-b { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.drawer-b > * { animation: rise .5s both; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); }
.field .inp, .field select { width: 100%; padding: 10px 12px; }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat4 div { background: var(--soft); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat4 b { font-size: 18px; }
.stat4 small { color: var(--muted); font-size: 11px; }
.dist { display: flex; flex-direction: column; gap: 6px; }
.dist-row { display: grid; grid-template-columns: 18px 1fr 1fr; gap: 8px; align-items: center; font-size: 12px; }
.dist-bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.dist-bar i { display: block; height: 100%; border-radius: 4px; transform-origin: left; animation: revealx .8s both; }

/* Survey */
.survey { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
.qprog { display: flex; gap: 4px; height: 26px; align-items: flex-end; }
.qprog span { flex: 1; border-radius: 3px; background: var(--line); height: 60%; transition: background .3s, height .3s; cursor: pointer; }
.qprog span.done { background: var(--teal); height: 80%; }
.qprog span.cur { background: var(--lime); height: 100%; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 16px;
  transition: border-color .2s, background .2s, transform .15s;
}
.opt:hover { border-color: var(--teal-pale); }
.opt.on { border-color: var(--teal); background: var(--teal-soft); }
.opt .rb { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--faint); flex: none; margin-top: 1px; display: grid; place-items: center; transition: border-color .2s; }
.opt.on .rb { border-color: var(--teal); }

      <span class="tn"><span>${esc(x.t)}</span><span class="tsub">${x.kind === "p" ? srcDot(x.src) + SRC[x.src][0] : srcDot("facts") + (x.kind === "pct" ? `${x.val[0]} з ${x.val[1]}` : `рівень ${x.val} з 5`)}${x.lim ? `<span class="lim-tag">Частка обмеження компонента</span>` : ""}</span></span>

      <span class="hm"><div class="contrib"><i style="width:${x.contrib / maxC * 100}%;background:${COMP[x.c].c}"></i></div><span class="lbl tnum">${f2(x.contrib)}</span></span><span></span></div>`;
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Вузол</th><th>Рівень</th><th>Вага, %</th><th>Значення</th><th>Внесок, пункти</th><th>Джерело</th></tr></thead><tbody>

  </tbody></table></div>`;
  return `${backToInst()}
  <section class="c12 rise toolbar"><span class="lbl">Звідки взялося кожне число. Клацніть на питання, щоб побачити подробиці.</span><div class="sp"></div>

    <button class="btn btn-ghost" onclick="S.exTable=!S.exTable;render(true)">${S.exTable ? IC.tree + "Показати як дерево" : IC.table + "Показати як таблицю"}</button></section>
  ${mode !== "credited" ? `<div class="c12 note-box rise" style="flex-direction:row;align-items:center;gap:10px">${IC.info}<span>Режим «${MODES[mode]}»: значення без обмежувача, тому верхній рядок (${f1(sum)}) не дорівнює індексу ${f1(m.index)}. До індексу йдуть зараховані значення.</span></div>` : ""}
  <section class="card c12 rise">
    ${S.exTable ? table : `<div class="tree-cols lbl"><span>Складова</span><span class="hm">Вага</span><span>Значення</span><span class="hm">Внесок в індекс, пункти</span><span></span></div>
    <div class="tree-root"><span><b>Індекс доброчесності</b><span class="lbl" style="display:block;font-size:12.5px">Середнє трьох компонентів: кожен дає третину індексу</span></span><span class="hm"></span><b class="tnum">${fb(sum)}</b><span class="lbl tnum hm">${f2(T.reduce((a, c) => a + c.contrib, 0))}</span><span></span></div>
    ${T.map((c, ci) => `<div class="tree-c ${S.open[c.id] ? "open" : ""} ${hl === c.id ? "hl" : ""}" id="n-${c.id}">
      <button class="tree-head" onclick="S.open['${c.id}']=!S.open['${c.id}'];this.parentNode.classList.toggle('open')" aria-expanded="${!!S.open[c.id]}">
        <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="comp-ic" style="background:${COMP[c.id].s};color:${COMP[c.id].c}">${IC[COMP[c.id].ic]}</span><span><b>${COMP[c.id].n}</b>${mode === "credited" ? `<span class="pf-sub tnum"><span>Сприйняття ${fb(c.P)}</span><span>Факти ${fb(c.F)}</span></span>` : ""}</span>${c.lim ? pill("Обмежувач", "p-warn") : ""}</span>
        <span class="hm"></span><b class="tnum">${fb(c.val)}</b>
        <span class="hm"><div class="contrib"><i style="width:${c.contrib / 34 * 100}%;background:${COMP[c.id].c};animation-delay:${ci * 120}ms"></i></div><span class="lbl tnum">${f2(c.contrib)}</span></span>
        <span class="chev">${IC.chev}</span></button>
      ${c.lim ? `<div class="lim-note">${c.cr.reason}</div>` : ""}
      <div class="tree-body"><div class="tree-row lbl hdr"><span>${mode === "facts" ? "Показник" : "Питання"}</span><span class="hm">Вага</span><span>Значення</span><span class="hm">Внесок</span><span></span></div>${c.items.map(row).join("")}</div>
    </div>`).join("")}`}
  </section>`;
};
V.explain.after = () => { if (S.focus) { const el = document.getElementById("n-" + S.focus); if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "center" }), 200); S.focus = null; } };

function openItem(id) {
  const m = cur(), x = allItems(m).find(i => i.id === id); if (!x) return;
  const c = m.byId[x.c], isP = x.kind === "p", q = isP && x.id !== "sy-p3" ? SURVEY_Q.find(q => q.si === COMPS.indexOf(x.c) && q.qi === (+x.id.slice(-1) - 1)) : null;
  openDrawer(isP ? "Питання анкети" : "Показник фактів", `
    <div><div class="lbl">${COMP[x.c].n} · ${isP ? SRC[x.src][0] : "Факти"}</div><div style="font-size:16px;font-weight:600;margin-top:4px">${esc(x.t)}</div></div>
    <div class="stat4 tnum" style="grid-template-columns:repeat(3,1fr)"><div><small>Значення</small><b>${fb(x.v)}</b></div><div><small>Вага в компоненті</small><b>${x.w} %</b></div><div><small>Внесок в індекс</small><b>${f2(x.v * (c.cr.v / (isP ? c.P : c.F) || 1) / 3 * x.w / 100)}</b></div></div>
    <div><div class="lbl" style="margin-bottom:4px">Звідки число</div><div style="line-height:1.55">${isP ? `${SRC_HINT[x.src]} Відповіді переводяться в бали: варіант 1 це 0, варіант 5 це 100.` : x.kind === "pct" ? `${x.val[0]} з ${x.val[1]}, тобто ${fb(x.v)} %. Джерело: ${x.from}.` : `Рівень ${x.val} з 5 за анкетою чек-листа. Рівень переводиться в бали: (рівень − 1) × 25 = ${fb(x.v)}. Джерело: ${x.from}.`}</div></div>
    ${q ? `<div><div class="lbl" style="margin-bottom:6px">Відповідне питання в анкеті особового складу</div><div style="font-weight:500;margin-bottom:6px">${esc(q.t)}</div><ol class="howto">${q.o.map(o => `<li>${esc(o)}</li>`).join("")}</ol></div>` : ""}
    <div><div class="lbl" style="margin-bottom:4px">Як іде в індекс</div><div style="line-height:1.55">Компонент «${COMP[x.c].n}»: ${isP ? `сприйняття ${fb(c.P)}` : `факти ${fb(c.F)}`} це зважене середнє ${isP ? "питань" : "показників"}. Зараховано ${fb(c.cr.v)}${c.cr.lim ? " з обмеженням: " + c.cr.reason : "."} Індекс це середнє трьох компонентів.</div></div>`);
}

/* Динаміка */
V.trends = () => {
  const m = cur(), sr = m.series, t = S.trend, from = Math.min(t.from, t.to), to = Math.max(t.from, t.to), rows = sr.slice(from, to + 1);
  const a = sr[Math.min(S.cmp.a, sr.length - 1)], b = sr[Math.min(S.cmp.b, sr.length - 1)];
  const evs = m.events.filter(e => rows.slice(0, -1).some(r => r.cycle === e.after));
  const d = r1(rows[rows.length - 1].index - rows[0].index);
  const cmpRows = [["Індекс доброчесності", a.index, b.index], ...COMPS.map(c => [COMP[c].n, a.cr[c], b.cr[c]])];
  const pos = COMPS.filter(c => b.cr[c] > a.cr[c]), neg = COMPS.filter(c => b.cr[c] < a.cr[c]);
  const opt = (sel, lim) => sr.map((r, i) => `<option value="${i}" ${i === sel ? "selected" : ""} ${lim && !lim(i) ? "disabled" : ""}>${r.cycle}</option>`).join("");
  return `${backToInst()}
  <section class="c12 rise"><span class="lbl">Як змінювався індекс доброчесності від циклу до циклу. Показано лише цей заклад, без порівняння з іншими.</span></section>
  <section class="card c12 rise">${trendCard(m, "trend", true)}</section>
  <section class="card c7 rise">
    <div class="card-h" style="flex-wrap:wrap"><h2>Порівняти два цикли</h2><div class="sp"></div>
      <label class="lbl">Було <select class="inp" onchange="S.cmp.a=+this.value;persist();render(true)">${opt(S.cmp.a)}</select></label>
      <label class="lbl">Стало <select class="inp" onchange="S.cmp.b=+this.value;persist();render(true)">${opt(S.cmp.b)}</select></label></div>
    ${a === b ? `<div class="empty">Оберіть два різні цикли, щоб побачити, що змінилося.</div>` : `<div class="tbl-wrap"><table><thead><tr><th>Показник</th><th>Було</th><th>Стало</th><th>Зміна</th></tr></thead><tbody>${cmpRows.map(([n, x, y]) => `<tr><td><b>${n}</b></td><td class="tnum">${fb(x)}</td><td class="tnum">${fb(y)}</td><td>${deltaHTML(r1(y - x))}</td></tr>`).join("")}</tbody></table></div>`}
  </section>
  <section class="card c5 rise">
    <div class="card-h"><h2>Висновок за весь період</h2></div>
    ${(() => { const f = sr[0], l = sr[sr.length - 1], p = COMPS.filter(c => l.cr[c] > f.cr[c]), n = COMPS.filter(c => l.cr[c] < f.cr[c]); return `<div class="rows">
      <div class="row" style="align-items:flex-start"><span class="comp-ic" style="background:var(--teal-soft);color:var(--teal-deep);width:28px;height:28px">${IC.up}</span><div class="grow">${p.length ? `Позитивна динаміка: ${p.map(c => `${COMP[c].n} (${pts(l.cr[c] - f.cr[c])})`).join(", ")}.` : "Позитивної динаміки за період немає."}</div></div>
      <div class="row" style="align-items:flex-start"><span class="comp-ic" style="background:${n.length ? "var(--red-soft)" : "var(--soft)"};color:${n.length ? "var(--red)" : "var(--muted)"};width:28px;height:28px">${n.length ? IC.down : IC.flat}</span><div class="grow">${n.length ? `Потребує уваги: ${n.map(c => `${COMP[c].n} (−${pts(f.cr[c] - l.cr[c])})`).join(", ")}.` : "Негативної динаміки за компонентами немає."}</div></div>
      ${m.events.map(e => `<div class="row"><span class="ev-ic ev-c">${IC.diamond}</span><div class="grow"><div class="t">${e.t}</div><div class="s">Після циклу ${e.after}</div></div></div>`).join("")}</div>`; })()}
  </section>`;
};
V.trends.after = () => drawTrend("trend", cur());

/* Рекомендації */
V.recs = () => {
  const all = buildRecs(), f = S.recF, list = all.filter(r => (f.st === "all" || r.st === f.st) && (f.c === "all" || r.c === f.c));
  return `
  <section class="c12 rise toolbar"><span class="lbl">Рекомендація це пропозиція системи, рішення приймає керівник.</span><div class="sp"></div>
    <select class="inp" aria-label="Статус" onchange="S.recF.st=this.value;persist();render(true)"><option value="all">Усі статуси</option>${Object.entries(REC_ST).map(([k, [n]]) => `<option value="${k}" ${f.st === k ? "selected" : ""}>${n}</option>`).join("")}</select>
    <select class="inp" aria-label="Компонент" onchange="S.recF.c=this.value;persist();render(true)"><option value="all">Усі компоненти</option>${COMPS.map(c => `<option value="${c}" ${f.c === c ? "selected" : ""}>${COMP[c].n}</option>`).join("")}</select>
    <span class="lbl tnum">Показано ${list.length} з ${all.length}</span></section>
  <div class="c12 recs">${list.length ? list.map((r, i) => `<article class="rec card rise" style="animation-delay:${i * 60}ms" id="${r.id}">
    <span class="pri" style="background:${PRI[r.pri][1]};color:${PRI[r.pri][2]}" data-tip="Пріоритет: ${PRI[r.pri][0].toLowerCase()}">${IC[r.pri === "high" ? "alert" : "flag"]}</span>
    <div style="min-width:0">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${pill("Пріоритет: " + PRI[r.pri][0].toLowerCase(), "nodot " + (r.pri === "high" ? "p-bad" : "p-mute"))}${pill(COMP[r.c].n, "p-mute nodot")}${pill(REC_ST[r.st][0], REC_ST[r.st][1])}</div>
      <h3>${r.t}</h3>
      <div class="lbl" style="margin:10px 0 4px">Чому система це пропонує</div><div>${r.why}</div>
      <div class="lbl" style="margin:12px 0 4px">На підставі</div>
      <div class="ev">${r.evidence.map(e => `<a href="#explain/${e.id}" class="ev-i">${e.item ? "" : `<span style="color:var(--red);display:inline-flex;width:14px">${IC.alert}</span>`}<span>${esc(e.t)}: <b>${e.v}</b></span><span class="lbl">Відкрити в розкладі ${IC.arrowR}</span></a>`).join("")}</div>
      <details class="acts"><summary>Запропоновані дії (${r.acts.length})</summary><ol>${r.acts.map(a => `<li>${a}</li>`).join("")}</ol></details>
      ${r.note.reason ? `<div class="note-box" style="margin-top:10px"><b>Причина відхилення</b><span>${esc(r.note.reason)}</span></div>` : ""}
      ${r.note.comment ? `<div class="note-box" style="margin-top:10px"><b>Коментар до уточнення</b><span>${esc(r.note.comment)}</span></div>` : ""}
    </div>
    <div class="rec-actions">${r.st === "accepted" ? `<a class="btn btn-soft" href="#tracker">${IC.target}Подивитися захід у трекері</a>` : REC_NEXT[r.st].map(n => n === "accepted" ? `<button class="btn btn-primary" onclick="acceptRec('${r.id}')">${IC.ok}Прийняти</button>` : n === "clarified" ? `<button class="btn btn-soft" onclick="noteRec('${r.id}','clarified')">Уточнити</button>` : `<button class="btn btn-ghost" onclick="noteRec('${r.id}','rejected')">Відхилити</button>`).join("")}</div>
  </article>`).join("") : `<section class="card"><div class="empty"><b>За цими фільтрами рекомендацій немає</b><br>Змініть статус або компонент. Нові рекомендації зʼявляються після кожного циклу оцінювання.</div></section>`}</div>`;
};
function acceptRec(id) {
  const r = buildRecs().find(x => x.id === id); if (!r) return;
  openDrawer("Прийняти рекомендацію", `
    <div><div class="lbl">${COMP[r.c].n}</div><div style="font-size:16px;font-weight:600;margin-top:4px">${r.t}</div></div>
    <div class="field"><label for="f-who">Відповідальна посада</label><select id="f-who" class="inp">${POSITIONS.map(w => `<option>${w}</option>`).join("")}</select></div>
    <div class="field"><label for="f-due">Строк виконання</label><input class="inp" type="date" id="f-due" min="${TODAY}" value="2027-02-28"><span class="err lbl" id="f-err"></span></div>
    <div class="note-box"><span class="lbl">Після прийняття в трекері зʼявиться захід із цією посадою й строком. Посаду і строк можна буде уточнити пізніше.</span></div>
    <div style="display:flex;gap:8px"><button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="closeDrawer()">Скасувати</button><button class="btn btn-primary" id="f-ok" style="flex:2;justify-content:center">${IC.ok}Прийняти й створити захід</button></div>`, b => {
    b.querySelector("#f-ok").onclick = () => {
      const due = b.querySelector("#f-due").value;
      if (!due || due < TODAY) { b.querySelector("#f-err").textContent = "Оберіть строк не раніше за сьогодні."; return; }
      const mid = "m-" + (BASE_MEASURES.length + S.dec.added.length + 1);
      S.dec.rec[id] = { status: "accepted" };
      S.dec.added.push({ id: mid, recId: id, rec: r.t, t: r.t, who: b.querySelector("#f-who").value, due, st: "accepted", ind: r.items[0] });
      addLog(me(), `Рекомендацію «${r.t}» прийнято, створено захід ${mid}`); persist(); closeDrawer(); render(true);
      toast(`Рекомендацію прийнято. Захід «${r.t}» додано до трекера.`);
    };
  });
}
function noteRec(id, kind) {
  const r = buildRecs().find(x => x.id === id); if (!r) return; const rej = kind === "rejected";
  openDrawer(rej ? "Відхилити рекомендацію" : "Уточнити рекомендацію", `
    <div style="font-weight:600">${r.t}</div>
    <div class="field"><label for="f-why">${rej ? "Причина відхилення" : "Короткий коментар"}</label><textarea class="inp" id="f-why" rows="4" style="resize:vertical"></textarea><span class="lbl" id="f-err">${rej ? "Причина обов’язкова: вона допоможе наступним оцінюванням." : "Що потрібно уточнити, перш ніж ухвалити рішення."}</span></div>
    <div style="display:flex;gap:8px"><button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="closeDrawer()">Скасувати</button><button class="btn ${rej ? "btn-danger" : "btn-primary"}" id="f-ok" style="flex:2;justify-content:center">${rej ? "Відхилити" : "Надіслати уточнення"}</button></div>`, b => {
    b.querySelector("#f-ok").onclick = () => {
      const t = b.querySelector("#f-why").value.trim();
      if (!t) { const e = b.querySelector("#f-err"); e.textContent = rej ? "Вкажіть причину відхилення." : "Напишіть, що саме потрібно уточнити."; e.style.color = "var(--red)"; b.querySelector("#f-why").focus(); return; }
      S.dec.rec[id] = rej ? { status: "rejected", reason: t } : { status: "clarified", comment: t };
      addLog(me(), `Рекомендацію «${r.t}» ${rej ? "відхилено" : "позначено «Уточнено»"}: ${t}`); persist(); closeDrawer(); render(true);
      toast(rej ? "Рекомендацію відхилено. Причину збережено." : "Рекомендацію позначено як «Уточнено». Коментар збережено.");
    };
  });
}

/* Трекер */
V.tracker = () => {
  const all = measures(), f = S.trF, edit = S.role === "leader";
  const list = all.filter(x => (f.st === "all" || dispSt(x) === f.st || (f.st === "overdue" && overdueDays(x) > 0)) && (f.who === "all" || x.who === f.who));
  const od = all.filter(x => overdueDays(x) > 0).length;

function doExport(k) { $("#exp").close(); if (k === "print") { addLog(me(), "Експорт звіту (PDF / друк)"); return setTimeout(() => window.print(), 50); } if (k === "copy") return copyOut("csv"); copyOut(k, true); }
function copyOut(kind, dl) {
  const m = cur(); let txt;
  if (kind === "html") { const doc = `<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Звіт ${CYCLE}</title><style>body{font:14pt/1.5 "Times New Roman",Times,serif;max-width:800px;margin:40px auto;padding:0 24px;color:#000}table{border-collapse:collapse;width:100%;margin:6px 0 12px}td,th{border:1px solid #000;padding:4px 6px;font-size:12pt;text-align:left;vertical-align:top}th{font-weight:bold}.doc-approve{margin-left:auto;width:300px}.doc-title{text-align:center;font-size:16pt;margin:24px 0 4px}.doc-sub{text-align:center;font-weight:bold}.doc-meta,.doc-note{font-size:11pt}.doc-cap{text-align:right;font-style:italic;margin-bottom:2px}.doc-sign{display:flex;justify-content:space-between;margin-top:36px}.doc-blank{display:inline-block;min-width:140px;border-top:1px solid #000;font-size:10pt;text-align:center}.noprint,svg,button{display:none}p{text-align:justify}</style></head><body>${document.querySelector(".paper").innerHTML}</body></html>`; return download(`integrity-report-${m.id}-${CYCLE}.html`, doc, "text/html"); }
  if (kind === "csv") txt = ["id;component;kind;label;source;weight;value", ...allItems(m).map(x => [x.id, x.c, x.src ? "perception" : "fact", `"${x.t.replace(/"/g, '""')}"`, x.src || x.kind, x.w, fb(x.v)].join(";")), ...m.components.map(c => [c.id, c.id, "component", COMP[c.id].n, "credited", "33.3", fb(c.cr.v)].join(";")), ["index", "", "index", "Індекс доброчесності", "", "100", fb(m.index)].join(";")].join("\n");
  else txt = JSON.stringify({ institution: m.name, cycle: CYCLE, asOf: TODAY, index: m.index, level: m.level, trust: m.trust, delta: m.delta,
    components: Object.fromEntries(m.components.map(c => [c.id, { perception: c.P, facts: c.F, credited: c.cr.v, limited: c.cr.lim }])),
    flags: m.raised.map(f => ({ id: f.id, weight: f.w, title: f.t })), measures: m.id === ALPHA ? measures() : [] }, null, 2);
  if (dl) return download(`integrity-${m.id}-${CYCLE}.${kind}`, (kind === "csv" ? "﻿" : "") + txt, kind === "csv" ? "text/csv" : "application/json");
  const done = () => { toast(kind.toUpperCase() + " скопійовано"); addLog(me(), `Експорт звіту (${kind.toUpperCase()})`); };
  try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); } catch (e) { fallbackCopy(txt, done); }
}
function download(name, txt, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: type + ";charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Завантажено: " + name); addLog(me(), `Експорт звіту (${name})`); }
function fallbackCopy(txt, done) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Не вдалося скопіювати"); } ta.remove(); }

  <section class="card c4 rise kpi-tile"><div class="kt-h"><span class="kt-ic">${IC.history}</span><span class="lbl">Очікують підтвердження</span></div><div class="kt-b"><span class="mid tnum" style="color:${pend - ret ? "var(--amber)" : "inherit"}">${pend - ret}</span><div class="kt-s lbl">До індексу не потрапляють</div></div></section>
  <section class="card c4 rise kpi-tile"><div class="kt-h"><span class="kt-ic">${IC.reset}</span><span class="lbl">Повернуто на уточнення</span></div><div class="kt-b"><span class="mid tnum" style="color:${ret ? "var(--red)" : "inherit"}">${ret}</span><div class="kt-s lbl">${ed ? "Виправте й внесіть знову" : "Чекають на виконавця"}</div></div></section>
  <section class="card c12 rise">
    <div class="card-h"><h2>Показники фактів</h2><div class="sp"></div><span class="lbl">${ed ? "Ви вносите дані. Підтверджує інший працівник." : "Ви підтверджуєте дані, які вніс інший працівник."}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Показник</th><th>Компонент</th><th>Підтверджене значення</th><th>Джерело і дата</th><th>Стан</th><th></th></tr></thead><tbody>
    ${FACTS.map(f => { const conf = S.facts[f.id], p = S.fpend[f.id], val = conf ? conf.val : f.base, meta = conf ? [conf.at, conf.by] : FACT_META[f.id] || ["10.11.2026", "Вносить дані чек-листа"];
      return `<tr><td style="min-width:240px"><b style="font-weight:600">${f.t}</b></td><td>${pill(COMP[f.c].n, "p-mute nodot")}</td>
        <td class="tnum" style="white-space:nowrap">${valText(f, val)}<div class="lbl">${fb(factValue(f, val))} зі 100</div></td>
        <td class="lbl" style="min-width:160px">${esc(conf && conf.src || f.from)}<br>${meta[0]} · ${meta[1]}</td>
        <td style="min-width:170px">${p ? (p.ret ? `${pill("Повернуто", "p-bad")}<div class="lbl" style="margin-top:4px">${esc(p.ret)}</div>` : `${pill("Очікує підтвердження", "p-warn")}<div class="lbl tnum" style="margin-top:4px">Нове: ${valText(f, p.val)} (${fb(factValue(f, p.val))})</div>`) : pill("Підтверджено", "p-good")}</td>
        <td style="white-space:nowrap">${ed ? `<button class="btn btn-soft" style="padding:6px 12px" onclick="editFact('${f.id}')">${IC.edit}Внести</button>` : p && !p.ret ? `<button class="btn btn-primary" style="padding:6px 12px" onclick="approveFact('${f.id}')">${IC.ok}Підтвердити</button> <button class="btn btn-ghost" style="padding:6px 12px" onclick="returnFact('${f.id}')">Повернути</button>` : ""}</td></tr>`; }).join("")}
    </tbody></table></div>
  </section>
  <section class="card c12 rise"><div class="lock">${IC.shield}<div><b>До індексу потрапляють лише підтверджені значення.</b><div class="lbl">Поточний індекс закладу ${f1(m.index)}. Після підтвердження система одразу перераховує компонент, обмежувач і прапорці. Кожна дія записується в журнал.</div></div></div></section>`;
};
function editFact(id) {
  const f = FACTS.find(x => x.id === id), p = S.fpend[id], conf = S.facts[id], val = p ? p.val : conf ? conf.val : f.base;
  openDrawer("Внести дані чек-листа", `
    <div><div class="lbl">${COMP[f.c].n}</div><div style="font-weight:600;margin-top:4px">${f.t}</div></div>
    ${f.kind === "pct" ? `<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label for="f-num">Кількість</label><input class="inp tnum" type="number" min="0" id="f-num" value="${val[0]}"></div><div class="field" style="flex:1"><label for="f-den">З них усього</label><input class="inp tnum" type="number" min="1" id="f-den" value="${val[1]}"></div></div>`
      : `<div class="field"><label>Рівень за анкетою чек-листа</label><div class="seg" id="f-lvl">${[1, 2, 3, 4, 5].map(l => `<button type="button" class="${l === val ? "on" : ""}" data-l="${l}">${l}</button>`).join("")}</div><span class="lbl">Рівень переводиться у шкалу 0-100: рівень 1 це 0, рівень 5 це 100.</span></div>`}
    <div class="field"><label for="f-src">Джерело (документ, реєстр)</label><input class="inp" id="f-src" value="${esc(conf && conf.src || f.from)}"></div>
    <span class="lbl" id="f-err"></span>
    <button class="btn btn-primary" id="f-ok" style="justify-content:center">${IC.send}Надіслати на підтвердження</button>`, b => {
    let lvl = val; b.querySelectorAll("#f-lvl button").forEach(x => x.onclick = () => { lvl = +x.dataset.l; b.querySelectorAll("#f-lvl button").forEach(y => y.classList.toggle("on", y === x)); });
    b.querySelector("#f-ok").onclick = () => {
      let v = lvl;
      if (f.kind === "pct") { const n = +b.querySelector("#f-num").value, d = +b.querySelector("#f-den").value; if (!(d > 0) || n < 0 || n > d || !Number.isInteger(n) || !Number.isInteger(d)) { const e = b.querySelector("#f-err"); e.textContent = "Кількість має бути цілим числом від 0 до загальної кількості."; e.style.color = "var(--red)"; return; } v = [n, d]; }
      S.fpend[id] = { val: v, src: b.querySelector("#f-src").value.trim() || f.from, at: TODAY_UA, by: me() };
      addLog(me(), `Чек-лист: внесено «${f.t}» = ${valText(f, v)}`); persist(); closeDrawer(); render(true); toast("Надіслано на підтвердження");
    };
  });
}
function approveFact(id) {
  const f = FACTS.find(x => x.id === id), p = S.fpend[id], before = inst(ALPHA).index;
  S.facts[id] = { val: p.val, src: p.src, at: TODAY_UA, by: p.by }; delete S.fpend[id];
  const after = inst(ALPHA).index;
  addLog(me(), `Чек-лист: підтверджено «${f.t}» = ${valText(f, p.val)}${after !== before ? `; індекс ${f1(before)} → ${f1(after)}` : ""}`); persist(); render(true);
  toast(after !== before ? `Підтверджено. Індекс перераховано: ${f1(before)} → ${f1(after)}` : "Підтверджено. Індекс не змінився.");
}
function returnFact(id) {
  const f = FACTS.find(x => x.id === id);
  openDrawer("Повернути на уточнення", `<div style="font-weight:600">${f.t}</div><div class="field"><label for="f-why">Що потрібно виправити</label><textarea class="inp" id="f-why" rows="3"></textarea></div><button class="btn btn-danger" id="f-no" style="justify-content:center">Повернути</button>`, b => {
    b.querySelector("#f-no").onclick = () => { const t = b.querySelector("#f-why").value.trim(); if (!t) { b.querySelector("#f-why").focus(); return; } S.fpend[id].ret = t; addLog(me(), `Чек-лист: «${f.t}» повернуто: ${t}`); persist(); closeDrawer(); render(true); toast("Повернуто виконавцю"); };
  });
}

/* Журнал */
V.audit = () => {
  const all = logItems(), q = (S.logQ || "").trim().toLowerCase(), who = S.logWho || "all";
  const shown = all.map((x, i) => ({ ...x, n: i + 1 })).filter(x => (who === "all" || x.who === who) && (!q || (x.a + " " + x.who + " " + x.t + " " + x.h).toLowerCase().includes(q))).reverse();
  // однакові записи підряд (наприклад, кілька перевірок) показуються одним рядком з лічильником
  const groups = []; shown.forEach(x => { const g = groups[groups.length - 1]; if (g && g[0].a === x.a && g[0].who === x.who) g.push(x); else groups.push([x]); });
  const actors = [...new Set(all.map(x => x.who))].sort();
  return `<section class="card c12 rise">
    <div class="card-h" style="flex-wrap:wrap"><h2>Журнал дій</h2><div class="sp"></div><span id="chainSt">${pill("Ланцюг цілісний", "p-good")}</span><button class="btn btn-soft" onclick="verifyChain()">${IC.shield}Перевірити цілісність</button></div>
    <div class="toolbar" style="margin-bottom:8px"><label class="search inst-search"><span>${IC.search}</span><input id="logQ" placeholder="Дія, роль, дата або хеш" value="${esc(S.logQ || "")}" oninput="S.logQ=this.value;render(true);const i=$('#logQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></label>
      <select class="inp" aria-label="Хто" onchange="S.logWho=this.value;render(true)"><option value="all">Усі ролі</option>${actors.map(a => `<option ${who === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
      <span class="lbl tnum">Показано ${shown.length} з ${all.length}</span></div>
    ${groups.length ? `<div class="tl">${groups.map((g, i) => { const x = g[0]; return `<div class="tl-i rise click" role="button" tabindex="0" style="animation-delay:${Math.min(i, 12) * 40}ms" onclick="openLog(${x.n}${g.length > 1 ? `,${g[g.length - 1].n}` : ""})" onkeydown="if(event.key==='Enter')this.click()"><span class="nd"></span><div><div style="font-weight:500">${esc(x.a)}${g.length > 1 ? ` <span class="pill p-mute nodot">×${g.length}</span>` : ""}</div><div class="lbl">${esc(x.who)} · ${g.length > 1 ? `${g[g.length - 1].t} – ${x.t}` : x.t}</div></div><span class="hash">${x.h}</span></div>`; }).join("")}</div>` : `<div class="empty">Записів за цим запитом немає.</div>`}
  </section>`;
};
// Подробиці запису: що, хто, коли, номер у ланцюгу, хеш попереднього, перевірка саме цього запису
function openLog(n, n2) {
  const all = logItems(), x = all[n - 1], prev = n > 1 ? all[n - 2].h : "0", ok = fnv(prev + x.t + x.who + x.a) === x.h;
  openDrawer("Запис журналу", `
    <div><div class="lbl">Запис № ${n} з ${all.length}</div><div style="font-size:16px;font-weight:600;margin-top:4px">${esc(x.a)}</div></div>
    ${n2 ? `<div class="note-box"><span class="lbl">Таких записів підряд: ${n - n2 + 1} (№ ${n2}–${n}). Показано останній.</span></div>` : ""}
    <dl class="inst-kv" style="grid-template-columns:auto 1fr"><dt>Хто</dt><dd>${esc(x.who)}</dd><dt>Коли</dt><dd class="tnum">${x.t}</dd><dt>Хеш запису</dt><dd><span class="hash">${x.h}</span></dd><dt>Хеш попереднього</dt><dd><span class="hash">${prev}</span></dd></dl>
    <div>${pill(ok ? "Запис не змінювали" : "Запис змінено після створення", ok ? "p-good" : "p-bad")}</div>
    <div class="lbl">Хеш рахується з попереднього хешу, часу, ролі й опису дії. Якщо змінити будь-що в цьому чи попередніх записах, хеші далі по ланцюгу не зійдуться. Імен і відповідей респондентів у журналі немає, лише ролі.</div>`);
}
function verifyChain() { let prev = "0", ok = true; logItems().forEach(x => { const h = fnv(prev + x.t + x.who + x.a); if (h !== x.h) ok = false; prev = h; }); addLog(me(), "Перевірка цілісності журналу"); const n = logItems().length; render(true); $("#chainSt").innerHTML = pill(ok ? `Перевірено ${n} записів, розривів немає` : "Ланцюг порушено", ok ? "p-good" : "p-bad"); toast(ok ? "Ланцюг цілісний. Сама перевірка теж записана в журнал." : "Ланцюг порушено"); }

/* Опитування за жетоном */
const answered = () => SURVEY_Q.filter(q => S.survey.a[q.id] != null).length;
V.survey = () => {
  const sv = S.survey, N = SURVEY_Q.length;
  if (S.tokenUsed && sv.phase !== "done") return `<div class="survey c12"><section class="card rise" style="padding:32px;text-align:center"><div class="done-ic" style="background:var(--soft);color:var(--muted)">${IC.lock}</div>
    <h2 style="margin:18px 0 6px;font-size:22px;font-weight:600">Цю анкету вже заповнено</h2><p class="lbl" style="max-width:480px;margin:0 auto 20px">Повторно відповісти за цим посиланням не можна: так ми захищаємо анонімність і не допускаємо подвоєних відповідей. Дякуємо за участь.</p>
    <a class="btn btn-primary" href="#me">Мої результати ${IC.arrowR}</a></section></div>`;
  if (sv.phase === "intro") return `<div class="survey c12"><section class="card rise" style="padding:28px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><span class="comp-ic" style="background:var(--lime-soft);color:var(--teal-deep)">${IC.shield}</span><span class="lbl">${SURVEY.cat} · жетон demo</span></div>
      <h2 style="margin:6px 0 4px;font-size:24px;font-weight:600;letter-spacing:-.02em">${SURVEY.title}</h2>
      <p class="lbl" style="margin:0 0 18px">Перш ніж почати: ${N} питань, анкета займе кілька хвилин. Ось що ми гарантуємо.</p>
      <div class="guar">
        <div>${IC.lock}<b>Без імен</b><span class="lbl">Ваші відповіді не повʼязані з вами і не містять імен.</span></div>
        <div>${IC.eye}<b>Лише кількість</b><span class="lbl">Адміністратор бачить лише кількість відповідей, а не те, що ви відповіли.</span></div>
        <div>${IC.users}<b>Від ${S.k} осіб</b><span class="lbl">Результати показують лише для груп не менше ${S.k} осіб.</span></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:12px"><span class="lbl">${answered() ? `Збережені раніше відповіді на цьому пристрої буде підставлено (${answered()} з ${N}).` : "Відповіді зберігаються на цьому пристрої, поки ви заповнюєте."}</span><button class="btn btn-primary" onclick="S.survey.phase='form';render()">Розумію, почати ${IC.arrowR}</button></div>
    </section></div>`;
  if (sv.phase === "done") return `<div class="survey c12"><section class="card rise" style="padding:36px;text-align:center"><div class="done-ic">${IC.ok}</div>
    <h2 style="margin:18px 0 6px;font-size:24px;font-weight:600">Дякуємо. Ваші відповіді збережено анонімно.</h2>
    <p class="lbl" style="max-width:520px;margin:0 auto 20px">Що далі: коли відповість достатньо людей (не менше ${S.k}), ви зможете побачити узагальнені результати свого підрозділу. Окремих відповідей і імен там не буде.</p>
    <a class="btn btn-primary" href="#me">Переглянути результати підрозділу ${IC.arrowR}</a></section></div>`;
  const sec = SURVEY.sections[sv.sec], last = sv.sec === SURVEY.sections.length - 1, miss = SURVEY_Q.filter(q => sv.a[q.id] == null);
  return `<div class="survey c12">
    <div class="sv-top"><span class="lbl">Розділ ${sv.sec + 1} з ${SURVEY.sections.length}</span><div class="qprog" style="flex:1">${SURVEY_Q.map(q => `<span class="${q.si === sv.sec ? "cur" : ""} ${sv.a[q.id] != null ? "done" : ""}"></span>`).join("")}</div><span class="lbl tnum">Відповіли на ${answered()} з ${N}</span><button class="icon-btn" aria-label="Закрити" onclick="S.survey.phase='intro';render();toast('Відповіді лишаються на цьому пристрої. Їх ще не надіслано.')">${IC.x}</button></div>
    <section class="card qcard" style="padding:24px" key="${sv.sec}">
      <div class="comp-top" style="margin-bottom:4px"><span class="comp-ic" style="background:${COMP[sec.id].s};color:${COMP[sec.id].c}">${IC[COMP[sec.id].ic]}</span><b style="font-size:18px">${sec.t}</b><span class="lbl">${sec.about}</span></div>
      ${sec.q.map(([id, t, o], qi) => `<fieldset class="qf" id="q-${id}"><legend>${qi + 1}. ${t}</legend><div class="opts">${o.map((x, i) => `<button type="button" class="opt ${sv.a[id] === i ? "on" : ""}" aria-pressed="${sv.a[id] === i}" onclick="pick('${id}',${i})"><span class="rb"></span><span>${x}</span></button>`).join("")}</div></fieldset>`).join("")}
      ${sv.miss && last && miss.length ? `<div class="note-box" style="margin-top:12px"><b>Залишилось відповісти на ${miss.length} ${miss.length === 1 ? "питання" : miss.length < 5 ? "питання" : "питань"}</b><span class="lbl">Натисніть на питання, щоб перейти до нього.</span>${miss.map(q => `<a class="link" href="javascript:void 0" onclick="S.survey.sec=${q.si};S.survey.miss=false;render(true);setTimeout(()=>document.getElementById('q-${q.id}').scrollIntoView({behavior:'smooth',block:'center'}),60)">Розділ «${SURVEY.sections[q.si].t}», питання ${q.qi + 1}</a>`).join("")}</div>` : ""}
      <div style="display:flex;justify-content:space-between;margin-top:20px;gap:10px">
        <button class="btn btn-ghost" ${sv.sec === 0 ? "disabled" : ""} onclick="S.survey.sec--;S.survey.miss=false;render();window.scrollTo(0,0)">${IC.arrowL}Назад</button>
        ${last ? `<button class="btn btn-primary" onclick="submitSurvey()">${IC.send}Надіслати</button>` : `<button class="btn btn-primary" onclick="S.survey.sec++;render();window.scrollTo(0,0)">Далі ${IC.arrowR}</button>`}
      </div>
    </section></div>`;
};
V.survey.after = () => { if (S.survey.phase === "done") S.survey.phase = "intro"; };
function pick(id, i) { S.survey.a[id] = i; try { localStorage.setItem("ii-survey-draft", JSON.stringify(S.survey.a)); } catch (e) {} render(true); }
function submitSurvey() {
  if (answered() < SURVEY_Q.length) { S.survey.miss = true; render(true); return; }
  S.survey = { phase: "done", sec: 0, a: {}, miss: false }; S.tokenUsed = true; UNIT_RESP[S.unit] = (UNIT_RESP[S.unit] || 0) + 1;
  try { localStorage.removeItem("ii-survey-draft"); } catch (e) {}
  addLog("Система", "Отримано анонімну відповідь, жетон погашено"); persist(); render();
}

/* Мої результати */
V.me = () => {
  const r = resolveUnit(S.unit), cr = UNIT_CR[r.unit.id] || Object.fromEntries(inst(ALPHA).components.map(c => [c.id, c.cr.v])), idx = indexOf(cr), lv = level(idx);
  return `
  <section class="c12 rise toolbar"><span class="lbl">Дякуємо, ось що ви допомогли побачити.</span><div class="sp"></div>

  ${r.hidden ? `<section class="card c12 rise"><div class="lock">${IC.lock}<div><b>${r.req.n}: результати приховано</b><div class="lbl">Недостатньо відповідей, щоб показати результати цієї групи (${UNIT_RESP[r.req.id]} з потрібних ${S.k}). Нижче дані підрозділу «${r.unit.n}». Це рівень вище, а не ваш підрозділ. Так захищено анонімність учасників.</div></div></div></section>` : ""}
  <section class="card c5 rise">
    <div class="lbl">${r.unit.n}: відповіли ${r.resp} осіб (потрібно не менше ${S.k})</div>
    <div class="big tnum" style="margin-top:12px">${numHTML(idx)}<span class="of">з 100</span></div>
    <div style="margin:10px 0 14px">${lvPill(lv)}</div>
    ${levelBar(idx)}
    <div class="lbl" style="margin-top:12px">Що це: індекс доброчесності від 0 до 100, середнє трьох компонентів. Шкала рівнів від 1 до 5.</div>
  </section>
  <section class="card c7 rise">

const setAvatar = () => { $("#avatar").textContent = ROLE[S.role][1]; $("#avatar").dataset.tip = ROLE[S.role][0]; };
role.onchange = () => { S.role = role.value; addLog(ROLE[S.role][0], "Вхід у систему"); persist(); setAvatar(); aiBtn(); aiClose(); closeDrawer(); location.hash = HOME[S.role]; render(); toast("Роль: " + ROLE[S.role][0]); };
$("#resetBtn").innerHTML = `${IC.reset}Скинути демо-дані`; $("#resetBtn").onclick = resetDemo;
setAvatar();
function themeIcon() { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; $("#themeBtn").innerHTML = dark ? IC.sun : IC.moon; }
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; themeIcon();
  try { localStorage.setItem("ii-theme", document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("ii-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
themeIcon();
$("#q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return; const q = e.target.value.trim().toLowerCase(); if (!q) return;
  if (allowed("explain")) { const hit = allItems(cur()).find(x => x.t.toLowerCase().includes(q)); if (hit) { location.hash = "explain/" + hit.id; return; } }
  const nav = NAV.find(n => n[1].toLowerCase().includes(q) && n[3].includes(S.role)); if (nav) location.hash = nav[0]; else toast("Нічого не знайдено");
});
// Пошук: Ctrl+K (на Mac ⌘K) і «/». Ctrl+F лишаємо браузеру: це пошук по тексту сторінки
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
$("#kbd").textContent = isMac ? "⌘K" : "Ctrl K"; $("#kbd").dataset.tip = `Швидкий пошук: ${isMac ? "⌘K" : "Ctrl+K"} або «/»`;
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") || (e.key === "/" && !typing)) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") closePop();
});
/* Доступність: розмір тексту й підвищений контраст (як на сайтах держорганів) */
function applyA11y() { const a = S.a11y || { z: 1, hc: false }; document.documentElement.style.zoom = a.z === 1 ? "" : a.z; document.documentElement.classList.toggle("hc", !!a.hc); }
function drawA11y() {
  const a = S.a11y;
  $("#pop").innerHTML = `<div class="lbl" style="text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:8px">Розмір тексту</div>
    <div style="display:flex;align-items:center;gap:10px"><button class="icon-btn" aria-label="Зменшити текст" onclick="setZoom(-1)" ${a.z <= 1 ? "disabled" : ""}>−</button><b class="tnum" style="min-width:48px;text-align:center">${Math.round(a.z * 100)} %</b><button class="icon-btn" aria-label="Збільшити текст" onclick="setZoom(1)" ${a.z >= 1.5 ? "disabled" : ""}>+</button></div>
    <label class="a11y-row"><span>Підвищений контраст</span><span class="sw"><input type="checkbox" ${a.hc ? "checked" : ""} onchange="S.a11y.hc=this.checked;persist();applyA11y()"><span></span></span></label>
    <button class="link-btn" onclick="S.a11y={z:1,hc:false};persist();applyA11y();drawA11y();render(true)">Скинути</button>`;
}
function setZoom(d) { S.a11y.z = Math.round(clamp(S.a11y.z + d * .125, 1, 1.5) * 1000) / 1000; persist(); applyA11y(); drawA11y(); render(true); placePop($("#a11yBtn")); }
$("#a11yBtn").innerHTML = IC.a11y;
$("#a11yBtn").onclick = e => { const p = $("#pop"), b = e.currentTarget; if (p.classList.contains("on") && p._btn === b) return closePop(); p._btn = b; drawA11y(); p.classList.add("on"); placePop(b); };
applyA11y();
/* Згортання бічного меню (на широких екранах): лишаються лише іконки */
function setSide(mini) {
  document.documentElement.classList.toggle("side-mini", mini);
  const b = $("#sideBtn"); b.innerHTML = mini ? IC.chevR : IC.chevL; b.setAttribute("aria-label", mini ? "Розгорнути меню" : "Згорнути меню"); b.setAttribute("aria-expanded", String(!mini)); b.dataset.tip = mini ? "Розгорнути меню" : "Згорнути меню";
  try { localStorage.setItem("ii-side", mini ? "mini" : ""); } catch (e) {}
  const { r } = route(); renderNav(r); setTimeout(() => V[r] && V[r].after && V[r].after(), 260);
}
$("#sideBtn").onclick = () => setSide(!document.documentElement.classList.contains("side-mini"));
document.querySelector(".side .search").addEventListener("click", () => { if (document.documentElement.classList.contains("side-mini")) { setSide(false); setTimeout(() => $("#q").focus(), 50); } });
try { setSide(localStorage.getItem("ii-side") === "mini"); } catch (e) { setSide(false); }
$("#aiLogo").innerHTML = IC.spark.replace("<svg", '<svg width="17" height="17"');
$("#aiClose").innerHTML = IC.x; $("#aiClose").onclick = aiClose;
$("#aiSend").innerHTML = IC.send;
$("#aiBtn").onclick = () => aiOpen();
$("#aiForm").addEventListener("submit", e => { e.preventDefault(); const q = $("#aiQ").value; $("#aiQ").value = ""; aiAsk(q); });
$("#aiOn").addEventListener("change", e => { S.aiOn = e.target.checked; persist(); addLog(me(), S.aiOn ? "ШІ-асистента увімкнено" : "ШІ-асистента вимкнено"); aiBtn(); aiRender(); if (S.aiOn) checkLive(); });
aiBtn();
render();
</script>
</body>
</html>
