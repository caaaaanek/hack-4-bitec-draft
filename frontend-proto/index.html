  </section>
  <section class="card c5 rise">
    <div class="card-h"><h2>Висновок за весь період</h2></div>
    ${(() => { const f = sr[0], l = sr[sr.length - 1], p = COMPS.filter(c => l.cr[c] > f.cr[c]), n = COMPS.filter(c => l.cr[c] < f.cr[c]); return `<div class="rows">
      <div class="row" style="align-items:center"><span class="comp-ic" style="background:var(--teal-soft);color:var(--teal-deep);width:28px;height:28px">${IC.up}</span><div class="grow">${p.length ? `Позитивна динаміка: ${p.map(c => `${COMP[c].n} (${pts(l.cr[c] - f.cr[c])})`).join(", ")}.` : "Позитивної динаміки за період немає."}</div></div>
      <div class="row" style="align-items:center"><span class="comp-ic" style="background:${n.length ? "var(--red-soft)" : "var(--soft)"};color:${n.length ? "var(--red)" : "var(--muted)"};width:28px;height:28px">${n.length ? IC.down : IC.flat}</span><div class="grow">${n.length ? `Потребує уваги: ${n.map(c => `${COMP[c].n} (−${pts(f.cr[c] - l.cr[c])})`).join(", ")}.` : "Негативної динаміки за компонентами немає."}</div></div>
      ${m.events.map(e => `<div class="row"><span class="ev-ic ev-c">${IC.diamond}</span><div class="grow"><div class="t">${e.t}</div><div class="s">Після циклу ${e.after}</div></div></div>`).join("")}</div>`; })()}
  </section>`;
};
V.trends.after = () => drawTrend("trend", cur());

/* Рекомендації */

V.tracker.after = () => {
  const board = document.querySelector(".board"); if (!board) return;
  let drag = null;
  const clear = () => { drag = null; board.classList.remove("dnd"); board.querySelectorAll(".dragging,.can-drop,.drop-over").forEach(x => x.classList.remove("dragging", "can-drop", "drop-over")); };
  board.ondragstart = e => {
    const c = e.target.closest(".b-card[draggable]"); if (!c) return;
    drag = { id: c.dataset.id, st: c.dataset.st }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", drag.id);
    c.classList.add("dragging"); board.classList.add("dnd");
    board.querySelectorAll(".col-b").forEach(col => col.classList.toggle("can-drop", (M_NEXT[drag.st] || []).includes(col.dataset.st)));
  };
  board.ondragend = clear;
  board.ondragover = e => {
    const col = e.target.closest(".col-b"); if (!drag || !col || !col.classList.contains("can-drop")) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-over").forEach(x => x !== col && x.classList.remove("drop-over")); col.classList.add("drop-over");
  };
  board.ondrop = e => { const col = e.target.closest(".col-b"); if (!drag || !col || !col.classList.contains("can-drop")) return; e.preventDefault(); const id = drag.id; clear(); setMSt(id, col.dataset.st); };
};

function openSource(i) {
  const [name, from, mo, age] = SOURCES[i], m = cur(), head = `<div><div class="lbl">${from}</div><div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">${pill(MODE[mo][0], MODE[mo][1])}<span class="lbl">${age}</span></div></div>`;
  const tbl = (hs, rows) => `<div class="tbl-wrap"><table><thead><tr>${hs.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const synth = `<div class="lbl">Записи синтетичні, для демонстрації. ${mo === "planned" || mo === "approval" ? "Після підключення інтеграції дані надходитимуть автоматично." : ""}</div>`;

  else if (i === 1) body = `${tbl(["Показник", "Дані", "Ким внесено"], m.fItems.map(x => [esc(x.t), `<span class="tnum">${x.kind === "pct" ? `${x.val[0]} з ${x.val[1]}` : `рівень ${x.val} з 5`}</span>`, (FACT_META[x.id] || ["10.11.2026", "Вносить дані чек-листа"]).join(", ") + ". Підтверджено"]))}`;
  else if (i === 2) { const d = SRC_DATA.decl; body = `<div class="stat4 tnum" style="grid-template-columns:repeat(3,1fr)"><div><small>Зобовʼязані</small><b>${d.n}</b></div><div><small>Подали вчасно</small><b>${d.ok}</b></div><div><small>Частка</small><b>${d.ok} %</b></div></div>${tbl(["Категорія", "Зобовʼязані", "Вчасно"], d.rows.map(r => [r[0], `<span class="tnum">${r[1]}</span>`, `<span class="tnum">${r[2]}</span>`]))}${synth}`; }
  else if (i === 3) body = `<div class="lbl">Повідомлення про потенційні конфлікти інтересів і висновки уповноваженого. Імена не показуються.</div>${tbl(["Номер", "Суть", "Статус", "Дата"], SRC_DATA.coi.map(r => [`<span class="tnum">${r[0]}</span>`, r[1], pill(r[2], r[2].includes("у строк") ? "p-good nodot" : r[2].includes("запізн") ? "p-bad nodot" : "p-mute nodot"), `<span class="tnum">${r[3]}</span>`]))}${synth}`;
  else if (i === 4) body = `<div class="lbl">Закупівлі закладу з ознаками ризику з проєкту оцінки закупівель.</div>${tbl(["Ідентифікатор", "Предмет", "Ознака", "Ризик"], SRC_DATA.proc.map(r => [`<span class="tnum" style="font-size:12px">${r[0]}</span>`, r[1], r[2], pill(r[3], r[3] === "Високий" ? "p-bad nodot" : r[3] === "Середній" ? "p-warn nodot" : "p-good nodot")]))}${synth}`;
  else if (i === 5) { const c = SRC_DATA.comp, t = c.reduce((a, r) => a + r[1], 0), ok = c.reduce((a, r) => a + r[2], 0); body = `<div class="stat4 tnum" style="grid-template-columns:repeat(3,1fr)"><div><small>Звернень</small><b>${t}</b></div><div><small>Розглянуто в строк</small><b>${ok}</b></div><div><small>Частка</small><b>${Math.round(ok / t * 100)} %</b></div></div>${tbl(["Тема", "Звернень", "У строк"], c.map(r => [r[0], `<span class="tnum">${r[1]}</span>`, `<span class="tnum">${r[2]}</span>`]))}${synth}`; }
  else body = `<div class="lbl">Поки статуси заходів змінюють вручну.</div>${can("tracker") ? `<a class="btn btn-soft" href="#tracker" onclick="closeDrawer()">${IC.target}Відкрити трекер заходів</a>` : `<div class="lbl">Заходів за цикл: ${measures().length}.</div>`}`;
  openDrawer(name, head + body);
}

function openAddInst() {
  const have = new Set(INSTITUTIONS().map(m => m.edrpou));
  const results = q => { q = q.trim().toLowerCase(); return REGISTRY.filter(([c, n]) => !q || c.includes(q) || n.toLowerCase().includes(q)); };
  const draw = (b, q) => { b.querySelector("#reg").innerHTML = results(q).map(([c, n]) => `<label class="row reg-row"><input type="checkbox" value="${c}" ${have.has(c) ? "disabled checked" : ""}><div class="grow"><div class="t">${n}</div><div class="s tnum">ЄДРПОУ ${c}</div></div>${have.has(c) ? pill("Вже в системі", "p-mute nodot") : ""}</label>`).join("") || `<div class="lbl">У реєстрі нічого не знайдено.</div>`; };
  openDrawer("Додати заклад", `
    <div class="field"><label for="f-q">Пошук у реєстрі</label><input class="inp" id="f-q" placeholder="Код ЄДРПОУ (8 цифр) або частина назви" inputmode="search"></div>

    <div class="note-box"><span class="lbl">Демо використовує синтетичний реєстр. У робочій версії пошук іде через бекенд у Єдиний державний реєстр (відкриті дані Мінʼюсту): назва й статус підтягуються автоматично, вручну нічого вводити не треба. Можна завантажити одразу всі заклади зі списку Міністерства оборони або файлом CSV з кодами.</span></div>`, b => {
    const inp = b.querySelector("#f-q"); draw(b, ""); inp.oninput = () => draw(b, inp.value);
    b.querySelector("#f-add").onclick = () => {
      const picked = [...b.querySelectorAll("#reg input:checked:not(:disabled)")].map(i => i.value);
      if (!picked.length) return toast("Оберіть хоча б один заклад");
      picked.forEach(c => { const [, n] = REGISTRY.find(r => r[0] === c); S.insts.extra.push({ id: "e" + c, name: n, edrpou: c }); addLog(me(), `Додано заклад ${c} з реєстру`); });
      persist(); closeDrawer(); render(true); toast(`Додано закладів: ${picked.length}`);
    };
  });
}

  const pctFacts = m.fItems.filter(x => x.kind === "pct");
  const marks = [["wg", "Робоча група"], ["os", "Особовий склад"], ["experts", "Експерти"]];
  return `${backToInst()}
  <section class="card c12 rise">
    <div class="card-h" style="flex-wrap:wrap"><h2>Сприйняття проти фактів</h2><button type="button" class="kt-info" aria-label="Як читати" data-tip="Точки показують середню оцінку кожної групи, риска це факти. Праворуч різниця «сприйняття мінус факти». Червоним позначено розрив понад ${CAP} пунктів: тоді вмикається обмежувач.">${IC.info}</button><div class="sp"></div><div class="legend">${marks.map(([s, n]) => `<span><i class="mk ${s}"></i>${n}</span>`).join("")}<span><i class="mk f"></i>Факти</span></div></div>

      return `<div class="db" style="cursor:pointer" role="link" tabindex="0" aria-label="${COMP[c.id].n}: розклад індексу" onclick="location.hash='explain/${c.id}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.hash='explain/${c.id}'}"><span class="t"><b>${COMP[c.id].n}</b><br><span class="lbl">Сприйняття ${fb(c.P)} · факти ${fb(c.F)}</span></span>
        <div class="track"><div class="gap ${gap > CAP ? "bad" : ""}" style="left:${lo}%;width:${hi - lo}%;animation-delay:${i * 80}ms"></div>
        ${vals.map(([s, v], j) => `<span class="m mk ${s}" style="left:${v}%;animation-delay:${200 + i * 80 + j * 60}ms" data-tip="${SRC[s][0]}: ${fb(v)}"></span>`).join("")}
        <span class="m mk f" style="left:${c.F}%;animation-delay:${400 + i * 80}ms" data-tip="Факти: ${fb(c.F)}"></span></div>
        <b class="tnum" style="text-align:right;color:${gap > CAP ? "var(--red)" : "var(--fg)"}" data-tip="Сприйняття мінус факти">${gap > 0 ? "+" : ""}${fb(gap)}</b></div>`; }).join("")}
    <div class="db-axis lbl tnum"><span></span><div><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><span></span></div>
  </section>
  <section class="card c5 rise cmp-radar">
    <div class="card-h" style="flex-wrap:wrap"><h2>Профіль компонентів</h2><div class="sp"></div><label class="lbl">Цикл ${CYCLE} порівняти з <select class="inp" onchange="S.cmpCycle=+this.value;persist();render(true)"><option value="-1">без порівняння</option>${m.series.slice(0, -1).map((r, i) => `<option value="${i}" ${S.cmpCycle === i ? "selected" : ""}>${r.cycle}</option>`).join("")}</select></label></div>

function doExport(k) { $("#exp").close(); if (k === "print") { addLog(me(), "Експорт звіту (PDF / друк)"); return setTimeout(() => window.print(), 50); } if (k === "copy") return copyOut("csv"); copyOut(k, true); }
function copyOut(kind, dl) {

  if (kind === "csv") txt = ["id;component;kind;label;source;weight;value", ...allItems(m).map(x => [x.id, x.c, x.src ? "perception" : "fact", `"${x.t.replace(/"/g, '""')}"`, x.src || x.kind, x.w, fb(x.v)].join(";")), ...m.components.map(c => [c.id, c.id, "component", COMP[c.id].n, "credited", "33.3", fb(c.cr.v)].join(";")), ["index", "", "index", "Індекс доброчесності", "", "100", fb(m.index)].join(";")].join("\n");
  else txt = JSON.stringify({ institution: m.name, cycle: CYCLE, asOf: TODAY, index: m.index, level: m.level, trust: m.trust, delta: m.delta,
    components: Object.fromEntries(m.components.map(c => [c.id, { perception: c.P, facts: c.F, credited: c.cr.v, limited: c.cr.lim }])),
    flags: m.raised.map(f => ({ id: f.id, weight: f.w, title: f.t })), measures: m.id === ALPHA ? measures() : [] }, null, 2);
  if (dl) return download(`integrity-${m.id}-${CYCLE}.${kind}`, (kind === "csv" ? "﻿" : "") + txt, kind === "csv" ? "text/csv" : "application/json");
  const done = () => { toast(kind.toUpperCase() + " скопійовано"); addLog(me(), `Експорт звіту (${kind.toUpperCase()})`); };
  try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); } catch (e) { fallbackCopy(txt, done); }
}
function download(name, txt, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: type + ";charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Завантажено: " + name); addLog(me(), `Експорт звіту (${name})`); }
function fallbackCopy(txt, done) { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Не вдалося скопіювати"); } ta.remove(); }

/* Журнал */
V.audit = () => {
  const all = logItems(), q = (S.logQ || "").trim().toLowerCase(), who = S.logWho || "all";
  const shown = all.map((x, i) => ({ ...x, n: i + 1 })).filter(x => (who === "all" || x.who === who) && (!q || (x.a + " " + x.who + " " + x.t + " " + x.h).toLowerCase().includes(q))).reverse();

  const groups = []; shown.forEach(x => { const g = groups[groups.length - 1]; if (g && g[0].a === x.a && g[0].who === x.who) g.push(x); else groups.push([x]); });

    ${groups.length ? `<div class="tl">${groups.map((g, i) => { const x = g[0]; return `<div class="tl-i rise click" role="button" tabindex="0" style="animation-delay:${Math.min(i, 12) * 40}ms" onclick="openLog(${x.n}${g.length > 1 ? `,${g[g.length - 1].n}` : ""})" onkeydown="if(event.key==='Enter')this.click()"><span class="nd"></span><div><div style="font-weight:500">${esc(x.a)}${g.length > 1 ? ` <span class="pill p-mute nodot">×${g.length}</span>` : ""}</div><div class="lbl">${esc(x.who)} · ${g.length > 1 ? `${g[g.length - 1].t} – ${x.t}` : x.t}</div></div><span class="hash">${x.h}</span></div>`; }).join("")}</div>` : `<div class="empty">Записів за цим запитом немає.</div>`}

};
// Подробиці запису: що, хто, коли, номер у ланцюгу, хеш попереднього, перевірка саме цього запису
function openLog(n, n2) {

    ${n2 ? `<div class="note-box"><span class="lbl">Таких записів підряд: ${n - n2 + 1} (№ ${n2}–${n}). Показано останній.</span></div>` : ""}
    <dl class="inst-kv" style="grid-template-columns:auto 1fr"><dt>Хто</dt><dd>${esc(x.who)}</dd><dt>Коли</dt><dd class="tnum">${x.t}</dd><dt>Хеш запису</dt><dd><span class="hash">${x.h}</span></dd><dt>Хеш попереднього</dt><dd><span class="hash">${prev}</span></dd></dl>

}
function verifyChain() { let prev = "0", ok = true; logItems().forEach(x => { const h = fnv(prev + x.t + x.who + x.a); if (h !== x.h) ok = false; prev = h; }); addLog(me(), "Перевірка цілісності журналу"); const n = logItems().length; render(true); $("#chainSt").innerHTML = pill(ok ? `Перевірено ${n} записів, розривів немає` : "Ланцюг порушено", ok ? "p-good" : "p-bad"); toast(ok ? "Ланцюг цілісний. Сама перевірка теж записана в журнал." : "Ланцюг порушено"); }

  return `<div class="dp" id="${id}" data-val="${value}" data-min="${min}"><button type="button" class="inp dp-field" aria-haspopup="dialog" aria-expanded="false"><span class="dp-txt">${value ? dpFmt(value) : "ДД.ММ.РРРР"}</span><span class="dp-ic">${IC.cal}</span></button></div>`;
}

function dpRender() {
  const { el, y, m, pop } = dpOpen;
  const min = el.dataset.min || "";
  const sel = el.dataset.val || "";
  const cells = dpGrid(y, m).cells.map(d => {
    if (d === null) return "<span></span>";
    const iso = dpIso(y, m, d);
    const cls = ["dp-day"];
    if (iso === sel) cls.push("is-sel");
    if (iso === TODAY) cls.push("is-today");
    return `<button type="button" class="${cls.join(" ")}" data-iso="${iso}"${min && iso < min ? " disabled" : ""}>${d}</button>`;
  }).join("");
  pop.innerHTML = `<div class="dp-head"><button type="button" class="dp-nav" data-nav="-1" aria-label="Попередній місяць">‹</button><b class="dp-title">${DP_MONTHS[m]} ${y}</b><button type="button" class="dp-nav" data-nav="1" aria-label="Наступний місяць">›</button></div><div class="dp-wd">${DP_WD.map(w => `<span>${w}</span>`).join("")}</div><div class="dp-grid">${cells}</div><div class="dp-foot"><button type="button" class="dp-today" data-today="1"${min && TODAY < min ? " disabled" : ""}>Сьогодні</button></div>`;
}

function dpOpenAt(dp) {
  dpClose();
  const [y, m] = (dp.dataset.val || TODAY).split("-").map(Number);
  dp.querySelector(".dp-field").setAttribute("aria-expanded", "true");
  const pop = document.createElement("div");
  pop.className = "dp-pop";
  pop.setAttribute("role", "dialog");
  document.body.appendChild(pop); // у body, щоб бічна панель з прокруткою й transform не обрізала вікно
  dpOpen = { el: dp, y, m: m - 1, pop };
  dpRender();
  // fixed: вікно не обрізається прокруткою бічної панелі; відкривається вгору, якщо знизу немає місця
  const r = dp.getBoundingClientRect(), pw = pop.offsetWidth, ph = 340, z = parseFloat(document.documentElement.style.zoom) || 1;
  const vw = window.innerWidth / z, vh = window.innerHeight / z, rb = r.bottom / z, rt = r.top / z;
  pop.style.left = Math.max(8, Math.min(r.left / z, vw - pw - 8)) + "px";
  pop.style.top = (rb + 6 + ph > vh && rt - 6 - ph > 0 ? rt - 6 - ph : rb + 6) + "px";
}

function dpClose(focus) {
  if (!dpOpen) return;
  const fld = dpOpen.el.querySelector(".dp-field");
  dpOpen.pop.remove();
  fld.setAttribute("aria-expanded", "false");
  dpOpen = null;
  if (focus) fld.focus();
}

function dpSelect(iso) {
  const el = dpOpen.el;
  el.dataset.val = iso;
  el.querySelector(".dp-txt").textContent = dpFmt(iso);
  dpClose(true);
}

document.addEventListener("click", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const fld = t.closest(".dp-field");
  if (fld) {
    const dp = fld.closest(".dp");
    const was = dpOpen && dpOpen.el === dp;
    dpClose();
    if (!was) dpOpenAt(dp);
    return;
  }
  if (!dpOpen) return;
  if (!dpOpen.el.contains(t) && !dpOpen.pop.contains(t)) { dpClose(); return; }
  const nav = t.closest("[data-nav]");
  if (nav) {
    const step = Number(nav.dataset.nav);
    dpOpen.m += step;
    if (dpOpen.m < 0) { dpOpen.m = 11; dpOpen.y--; }
    if (dpOpen.m > 11) { dpOpen.m = 0; dpOpen.y++; }
    dpRender();
    dpOpen.pop.querySelector(`[data-nav="${step}"]`).focus();
    return;
  }
  const day = t.closest("[data-iso]");
  if (day && !day.disabled) { dpSelect(day.dataset.iso); return; }
  const today = t.closest("[data-today]");
  if (today && !today.disabled) dpSelect(TODAY);
});

// Capture-фаза: Escape закриває лише вікно дати, а не драбину (5-ai-router.js слухає Escape на document).
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && dpOpen) { e.stopImmediatePropagation(); dpClose(true); }
}, true);

// Вікно прив'язане до екрана (fixed): під час прокрутки чи зміни розміру просто закриваємо
document.addEventListener("scroll", e => { if (dpOpen && !(e.target.closest && e.target.closest(".dp-pop"))) dpClose(); }, true);
addEventListener("resize", () => dpClose());

/* --- Конструктор анкет (укладач): повноекранний редактор чернетки ---
   Працює з бекендом: POST /questionnaires, PATCH /{id}, PUT /{id}/structure, GET /{id}/validate, POST /{id}/publish.
   Редагувати можна лише чернетку; опубліковану спершу копіюють у нову версію (кнопка «Нова версія»). */
const BLD_COMP = [["culture", "Культура"], ["system", "Система"], ["accountability", "Підзвітність"], ["overall", "Загальна самооцінка"]];
const BLD_TYPE = [["single_choice", "Один варіант"], ["multiple_choice", "Кілька варіантів"], ["scale", "Шкала"]];
const BLD_UP = IC.chev.replace("<svg", `<svg style="transform:rotate(180deg)"`);
let B = null; // стан редактора: { q (мета з сервера), sections, dirty, issues }

// Код анкети з назви: українська транслітерація, лише латиниця, цифри й дефіс
const BLD_TR = { а: "a", б: "b", в: "v", г: "h", ґ: "g", д: "d", е: "e", є: "ye", ж: "zh", з: "z", и: "y", і: "i", ї: "yi", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "kh", ц: "ts", ч: "ch", ш: "sh", щ: "shch", ь: "", ю: "yu", я: "ya", "'": "", "’": "" };
const bldSlug = t => t.trim().toLowerCase().replace(/./g, c => BLD_TR[c] ?? c).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const bldNewQ = (n) => ({ code: "q" + Date.now().toString(36) + n, text: "", help_text: "", type: "single_choice", required: true, weight: 1, scale_min: null, scale_max: null, options: [{ text: "", score: 1 }, { text: "", score: 0 }] });
const bldNewSec = () => ({ title: "", component: "culture", questions: [bldNewQ(0)] });
const bldPlural = (n, a, b, c) => { const m = n % 10, h = n % 100; return `${n} ${h > 10 && h < 15 ? c : m === 1 ? a : m > 1 && m < 5 ? b : c}`; };

function bldFromServer(q) {
  return {
    q: { id: q.id, code: q.code, version: q.version, status: q.status, title: q.title, description: q.description || "", kind: q.kind, target_category: q.target_category },
    sections: q.sections.map(s => ({ title: s.title, component: s.component, questions: s.questions.map(x => ({ code: x.code, text: x.text, help_text: x.help_text || "", type: x.type, required: x.required, weight: x.weight, scale_min: x.scale_min, scale_max: x.scale_max, options: x.options.map(o => ({ text: o.text, score: o.score })) })) })),
    dirty: false, issues: null, busy: false,
  };
}
// Структура для PUT: для шкали варіантів немає, для вибору шкали немає
const bldPayload = () => ({ sections: B.sections.map(s => ({ title: s.title.trim(), component: s.component, questions: s.questions.map(x => ({ code: x.code, text: x.text.trim(), help_text: x.help_text.trim(), type: x.type, required: x.required, weight: Number(x.weight) || 0, scale_min: x.type === "scale" ? Number(x.scale_min) : null, scale_max: x.type === "scale" ? Number(x.scale_max) : null, options: x.type === "scale" ? [] : x.options.map(o => ({ text: o.text.trim(), score: Number(o.score) || 0 })) })) })) });

async function bldOpen(id) {
  try { const q = await api(`/questionnaires/${id}`); B = bldFromServer(q); bldMount(); } catch (e) { apiFail(e); }
}
function bldMount() {

  if (!ov) { ov = document.createElement("div"); ov.id = "bld"; ov.className = "bld"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Конструктор анкети"); document.body.appendChild(ov); }

function bldClose(force) {

  document.body.classList.remove("bld-open"); B = null;
  if (typeof apiSurveysReload === "function") apiSurveysReload(); else { API.qs = null; render(true); }

    <details class="bld-more"><summary>Підказка до питання</summary><textarea class="inp" rows="2" data-f="q.help_text" data-p="${p}" placeholder="Необов'язково: пояснення, що мається на увазі">${esc(x.help_text)}</textarea></details>

function bldSec(s, si, lastS) {
  return `<section class="bld-sec"><div class="bld-sec-h"><span class="pv-num">${si + 1}</span>
    <div class="field bld-grow"><label>Назва розділу</label><input class="inp" data-f="s.title" data-p="${si}" value="${esc(s.title)}" placeholder="Наприклад, Культура"></div>
    <div class="field bld-comp"><label>Компонент індексу</label><select class="inp" data-f="s.component" data-p="${si}">${BLD_COMP.map(([v, n]) => `<option value="${v}" ${s.component === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="bld-move"><button type="button" class="icon-btn sm" data-a="s-up" data-p="${si}" ${si === 0 ? "disabled" : ""} aria-label="Розділ вище">${BLD_UP}</button><button type="button" class="icon-btn sm" data-a="s-down" data-p="${si}" ${lastS ? "disabled" : ""} aria-label="Розділ нижче">${IC.chev}</button><button type="button" class="icon-btn sm" data-a="del-s" data-p="${si}" aria-label="Видалити розділ" data-tip="Видалити розділ">${IC.x}</button></div></div>
    ${s.questions.map((x, qi) => bldQ(x, si, qi, qi === s.questions.length - 1)).join("")}
    <button type="button" class="btn btn-soft bld-add" data-a="add-q" data-p="${si}">${IC.plus}Додати питання</button></section>`;

function bldDraw() {
  const ov = document.getElementById("bld"); if (!ov || !B) return;
  const m = B.q, nq = B.sections.reduce((a, s) => a + s.questions.length, 0), scrollTop = ov.querySelector(".bld-body") ? ov.querySelector(".bld-body").scrollTop : 0;
  ov.innerHTML = `<div class="bld-top"><div class="bld-top-in"><button type="button" class="icon-btn" data-a="close" aria-label="Закрити конструктор">${IC.x}</button>
      <div class="bld-title"><b>${esc(m.title || "Нова анкета")}</b><span class="lbl">Версія ${m.version} · ${bldPlural(B.sections.length, "розділ", "розділи", "розділів")}, ${bldPlural(nq, "питання", "питання", "питань")} ${B.dirty ? "· є незбережені зміни" : "· збережено"}</span></div>
      <div class="bld-actions"><button type="button" class="btn btn-ghost" data-a="validate" ${B.busy ? "disabled" : ""}>${IC.check}Перевірити</button><button type="button" class="btn btn-soft" data-a="save" ${B.busy || !B.dirty ? "disabled" : ""}>Зберегти</button><button type="button" class="btn btn-primary" data-a="publish" ${B.busy ? "disabled" : ""}>${IC.ok}Опублікувати</button></div></div></div>
    <div class="bld-body"><div class="bld-wrap">
      ${B.confirmClose ? `<div class="bld-note warn"><b>Є незбережені зміни.</b> Закрити без збереження?<div class="bld-note-act"><button type="button" class="btn btn-ghost" data-a="stay">Лишитись</button><button type="button" class="btn btn-danger" data-a="close-force">Закрити без збереження</button></div></div>` : ""}
      ${B.issues ? (B.issues.length ? `<div class="bld-note warn"><b>Перед публікацією виправте:</b><ul>${B.issues.map(i => `<li>${esc(bldIssuePath(i.path))}${esc(i.message)}</li>`).join("")}</ul></div>` : `<div class="bld-note ok"><b>Усе гаразд.</b> Анкету можна публікувати.</div>`) : ""}
      <section class="card bld-meta"><div class="bld-row"><div class="field bld-grow"><label>Назва анкети</label><input class="inp" data-f="m.title" value="${esc(m.title)}"></div></div>
        <div class="field"><label>Опис</label><textarea class="inp" rows="2" data-f="m.description" placeholder="Необов'язково: для кого й навіщо ця анкета">${esc(m.description)}</textarea></div>
        <div class="bld-row"><div class="field"><label>Для кого</label><select class="inp" data-f="m.target_category">${Object.entries(QCAT).map(([v, n]) => `<option value="${v}" ${m.target_category === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
          <div class="field"><label>Вид</label><select class="inp" data-f="m.kind"><option value="survey" ${m.kind === "survey" ? "selected" : ""}>Анкета зрілості</option><option value="checklist" ${m.kind === "checklist" ? "selected" : ""}>Чек-лист</option></select></div></div></section>
      ${B.sections.map((s, si) => bldSec(s, si, si === B.sections.length - 1)).join("")}
      <button type="button" class="btn btn-soft bld-add bld-add-s" data-a="add-s">${IC.plus}Додати розділ</button>
    </div></div>`;
  const body = ov.querySelector(".bld-body"); if (body) body.scrollTop = scrollTop;
}
const bldIssuePath = p => { const m = String(p || "").match(/sections\[(\d+)\](?:\.questions\[(\d+)\])?/); return m ? `Розділ ${+m[1] + 1}${m[2] != null ? `, питання ${+m[2] + 1}` : ""}: ` : ""; };

// --- Події (делеговані на документ, бо редактор перемальовується) ---
function bldAt(path) { const [si, qi, oi] = String(path).split(".").map(Number); return { s: B.sections[si], q: Number.isInteger(qi) ? B.sections[si].questions[qi] : null, o: Number.isInteger(oi) ? B.sections[si].questions[qi].options[oi] : null, si, qi, oi }; }
const bldMove = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
function bldSet(el) {
  const f = el.dataset.f, a = el.dataset.p != null ? bldAt(el.dataset.p) : {}, v = el.type === "checkbox" ? el.checked : el.value;
  if (f.startsWith("m.")) B.q[f.slice(2)] = v;
  else if (f === "s.title") a.s.title = v; else if (f === "s.component") a.s.component = v;
  else if (f === "q.text") a.q.text = v; else if (f === "q.help_text") a.q.help_text = v; else if (f === "q.required") a.q.required = v;
  else if (f === "q.weight") a.q.weight = String(v).replace(",", ".");
  else if (f === "q.scale_min") a.q.scale_min = v === "" ? null : +v; else if (f === "q.scale_max") a.q.scale_max = v === "" ? null : +v;
  else if (f === "q.type") { a.q.type = v; if (v === "scale") { a.q.scale_min = a.q.scale_min ?? 1; a.q.scale_max = a.q.scale_max ?? 5; } else if (a.q.options.length < 2) a.q.options = [{ text: "", score: 1 }, { text: "", score: 0 }]; B.dirty = true; return bldDraw(); }
  else if (f === "o.text") a.o.text = v; else if (f === "o.score") a.o.score = String(v).replace(",", ".");
  if (!B.dirty) { B.dirty = true; B.issues = null; const t = document.querySelector("#bld .bld-title .lbl"); if (t) t.textContent = t.textContent.replace("· збережено", "· є незбережені зміни"); const sv = document.querySelector('#bld [data-a="save"]'); if (sv) sv.disabled = false; }
}
document.addEventListener("input", e => { if (B && e.target.closest("#bld") && e.target.dataset.f && e.target.tagName !== "SELECT" && e.target.type !== "checkbox") bldSet(e.target); });
document.addEventListener("change", e => { if (B && e.target.closest("#bld") && e.target.dataset.f && (e.target.tagName === "SELECT" || e.target.type === "checkbox")) bldSet(e.target); });
document.addEventListener("keydown", e => { if (B && e.key === "Escape" && document.getElementById("bld") && !e.target.closest(".combo")) bldClose(); });
document.addEventListener("click", async e => {
  const b = e.target.closest("#bld [data-a]"); if (!b || !B) return;
  const act = b.dataset.a, a = b.dataset.p != null ? bldAt(b.dataset.p) : {};
  const touch = () => { B.dirty = true; B.issues = null; bldDraw(); };
  if (act === "close") return bldClose();
  if (act === "close-force") return bldClose(true);
  if (act === "stay") { B.confirmClose = false; return bldDraw(); }
  if (act === "add-s") { B.sections.push(bldNewSec()); return touch(); }
  if (act === "del-s") { B.sections.splice(a.si, 1); return touch(); }
  if (act === "s-up") { bldMove(B.sections, a.si, -1); return touch(); }
  if (act === "s-down") { bldMove(B.sections, a.si, 1); return touch(); }
  if (act === "add-q") { a.s.questions.push(bldNewQ(a.s.questions.length)); return touch(); }
  if (act === "del-q") { a.s.questions.splice(a.qi, 1); return touch(); }
  if (act === "q-up") { bldMove(a.s.questions, a.qi, -1); return touch(); }
  if (act === "q-down") { bldMove(a.s.questions, a.qi, 1); return touch(); }
  if (act === "add-opt") { a.q.options.push({ text: "", score: 0 }); return touch(); }
  if (act === "del-opt") { a.q.options.splice(a.oi, 1); return touch(); }
  if (act === "save") return bldSave();
  if (act === "validate") { if (B.dirty && !(await bldSave(true))) return; return bldValidate(); }
  if (act === "publish") return bldPublish();
});
async function bldSave(silent) {
  B.busy = true; bldDraw();
  try {
    await api(`/questionnaires/${B.q.id}`, { method: "PATCH", body: { title: B.q.title.trim() || "Без назви", description: B.q.description, kind: B.q.kind, target_category: B.q.target_category } });
    await api(`/questionnaires/${B.q.id}/structure`, { method: "PUT", body: bldPayload() });
    B.dirty = false; B.busy = false; bldDraw(); if (!silent) toast("Чернетку збережено"); return true;
  } catch (err) { B.busy = false; bldDraw(); toast(apiErrText(err)); return false; }
}
async function bldValidate() {
  try { B.issues = await api(`/questionnaires/${B.q.id}/validate`); bldDraw(); const top = document.querySelector("#bld .bld-body"); if (top) top.scrollTop = 0; return B.issues; } catch (err) { apiFail(err); return null; }
}
async function bldPublish() {
  if (B.dirty && !(await bldSave(true))) return;
  const issues = await bldValidate(); if (!issues || issues.length) return;
  try { await api(`/questionnaires/${B.q.id}/publish`, { method: "POST" }); toast("Анкету опубліковано"); bldClose(true); } catch (err) { apiFail(err); }
}
// Створення нової анкети: коротка форма, далі редактор
function bldNew() {
  openDrawer("Нова анкета", `
    <div class="field"><label for="bn-t">Назва</label><input class="inp" id="bn-t" placeholder="Наприклад, Анкета для курсантів"></div>
    <div class="field"><label for="bn-c">Код</label><input class="inp" id="bn-c" placeholder="kursanty-survey"><span class="lbl">Латиницею, цифри, дефіс. За кодом пов'язуються версії анкети.</span></div>
    <div class="field"><label>Для кого</label><select class="inp" id="bn-g">${Object.entries(QCAT).map(([v, n]) => `<option value="${v}">${n}</option>`).join("")}</select></div>
    <div class="field"><label>Вид</label><select class="inp" id="bn-k"><option value="survey">Анкета зрілості</option><option value="checklist">Чек-лист</option></select></div>
    <span class="lbl" id="bn-err" style="color:var(--red)"></span>
    <button class="btn btn-primary" id="bn-ok" style="justify-content:center">${IC.plus}Створити й відкрити конструктор</button>`, b => {
    const code = b.querySelector("#bn-c"), title = b.querySelector("#bn-t");
    title.oninput = () => { if (!code.dataset.touched) code.value = bldSlug(title.value); };
    code.oninput = () => { code.dataset.touched = "1"; };
    b.querySelector("#bn-ok").onclick = async () => {
      const t = title.value.trim(), c = code.value.trim();
      if (!t) return void (b.querySelector("#bn-err").textContent = "Вкажіть назву.");
      if (!/^[a-z0-9_.-]+$/.test(c)) return void (b.querySelector("#bn-err").textContent = "Код: лише латиниця, цифри, дефіс і крапка.");
      try { const q = await api("/questionnaires", { method: "POST", body: { code: c, title: t, description: "", kind: b.querySelector("#bn-k").value, target_category: b.querySelector("#bn-g").value, sections: [] } }); closeDrawer(); B = bldFromServer(q); B.sections = [bldNewSec()]; B.dirty = true; bldMount(); }
      catch (e) { b.querySelector("#bn-err").textContent = apiErrText(e); }
    };
  });
}
</script>
