# Усе одним запуском: cp .env.example .env (заповнити), потім docker compose up --build
# Фронтенд: http://localhost:8080 (API там само за /api/v1), API напряму: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imd
      POSTGRES_USER: imd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # По TCP: під час першої ініціалізації тимчасовий сервер слухає лише сокет, і pg_isready без -h відповідав би «готово» зарано
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U imd -d imd"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://imd:${POSTGRES_PASSWORD}@db:5432/imd
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET у .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Задайте DEMO_PASSWORD у .env}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      INTEGRATION_KEYS: ${INTEGRATION_KEYS:-}
      TIMEZONE: ${TIMEZONE:-Europe/Kyiv}
      DEFAULT_MIN_GROUP_SIZE: ${DEFAULT_MIN_GROUP_SIZE:-5}
      THEME2_URL: ${THEME2_URL:-}
      THEME2_API_KEY: ${THEME2_API_KEY:-}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_URL: ${ASSISTANT_URL:-http://host.docker.internal:11434/api/generate}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-llama3.1:8b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Демо-історія при старті: дві закриті хвилі, рішення й заходи (повторний старт нічого не дублює)
      SEED_WITH_WAVES: ${SEED_WITH_WAVES:-true}
      ROOT_PATH: ${ROOT_PATH:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-10485760}
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-true}
      PROXY_AUTH_ENABLED: ${PROXY_AUTH_ENABLED:-false}
      PROXY_AUTH_HEADER: ${PROXY_AUTH_HEADER:-X-Remote-User}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PROXY_AUTH_SECRET: ${PROXY_AUTH_SECRET:-}
      # Асистент фронтенду (/api/assistant): OpenAI-сумісна модель. Порожньо — відповіді шаблонами правил.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
    volumes:
      - evidence:/data/evidence
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Фронтенд: frontend-proto (одна сторінка) через nginx; /api проксіюється на backend.
  frontend:
    build: ./frontend-proto
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  evidence: 