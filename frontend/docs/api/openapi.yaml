  /trends:
    get:
      tags: [analytics]
      operationId: getTrends
      summary: Динаміка по циклах
      description: |
        Цикли в періоді `from`-`to` (включно) з датами й значеннями по компонентах. Режим `compare=periods`
        порівнює два періоди (`from`-`to` і `compareFrom`-`compareTo`) і повертає обидва набори циклів та різницю.
      x-roles: [leader, observer, auditor]
      parameters:
        - $ref: '#/components/parameters/Scope'
        - {
            name: from,
            in: query,
            description: 'Початок періоду (id циклу або дата YYYY-MM-DD).',
            schema: { type: string, example: '2025-12' },
          }
        - {
            name: to,
            in: query,
            description: 'Кінець періоду (id циклу або дата).',
            schema: { type: string, example: '2026-11' },
          }
        - {
            name: compare,
            in: query,
            description: 'none це один період, periods це порівняння двох періодів.',
            schema: { type: string, enum: [none, periods], default: none },
          }
        - {
            name: compareFrom,
            in: query,
            description: 'Початок другого періоду (лише compare=periods).',
            schema: { type: string },
          }
        - {
            name: compareTo,
            in: query,
            description: 'Кінець другого періоду (лише compare=periods).',
            schema: { type: string },
          }
      responses:
        '200':
          description: Динаміка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trends' }
              example:
                period: { from: '2025-12', to: '2026-11' }
                points:
                  - {
                      cycle: '2025-12',
                      date: '2025-12-15',
                      index: 41.0,
                      components: { culture: 44, system: 36, accountability: 43 },
                    }
                  - {
                      cycle: '2026-06',
                      date: '2026-06-15',
                      index: 47.0,
                      components: { culture: 50, system: 41, accountability: 50 },
                    }
                  - {
                      cycle: '2026-11',
                      date: '2026-11-16',
                      index: 54.2,
                      components: { culture: 57.5, system: 45, accountability: 60 },
                    }
                events:
                  - { cycle: '2026-06', title: Виконано захід за рекомендацією, measureId: m1 }
