      operationId: listAudit
      summary: Журнал дій
      description: Відповідей респондентів у журналі немає.
      x-roles: [admin, auditor]
      parameters:
        - { name: event, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  nextCursor: { type: [string, 'null'] }
  /audit/verify:
    post:
      tags: [reports]
      operationId: verifyAudit
      summary: Перевірити цілісність журналу
      x-roles: [admin, auditor]
      responses:
        '200':
          description: Результат перевірки
          content:
            application/json:
              schema:
                type: object
                required: [intact, message, checkedEntries]
                properties:
                  intact: { type: boolean }
                  message: { type: string, example: Журнал не змінювався }
                  checkedEntries: { type: integer, example: 1284 }
  /methodology:
    get:
      tags: [reports]
      operationId: getMethodology
      summary: 'Методологія: версія, хеш, ваги, пороги'
      x-roles: [admin, leader, observer, commissioner]
      responses:
        '200':
          description: Поточна методика
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Methodology' }
              example:
                version: '1.0'
                hash: 'sha256:узгодити'
                componentWeights: { culture: 0.3333, system: 0.3333, accountability: 0.3333 }
                levelUpperBounds: [12.5, 37.5, 62.5, 87.5]
                limiterMargin: 25
                minGroupK: 5
                frozen: false
    patch:
      tags: [reports]
      operationId: updateMethodology
      summary: Змінити налаштування методології (створює нову версію)
      description: Не діє на відкриті цикли (там ваги заморожені).
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                componentWeights: { $ref: '#/components/schemas/ComponentWeights' }
                limiterMargin: { type: number }
                minGroupK: { type: integer, minimum: 2 }
      responses:
        '200':
          description: Нова версія методики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Methodology' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сесії. Механізм узгодити.
  parameters:
    QuestionnaireId: { name: questionnaireId, in: path, required: true, schema: { type: string } }
    CycleId: { name: cycleId, in: path, required: true, schema: { type: string } }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Ідентифікатор призначення (не людини і не відповіді).
      schema: { type: string }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string } }
    Cycle:
      name: cycle
      in: query
      description: Id циклу, за замовчуванням останній опублікований.
      schema: { type: string, example: '2026-11' }
    Scope:
      name: scope
      in: query
      description: Id вузла дерева підрозділів (`GET /units`), за замовчуванням корінь. Роль обмежує доступні значення; недоступний scope дає 403.
      schema: { type: string, default: institution }
  responses:
    Unauthorized:
      description: Потрібен вхід
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthorized, message: Сесія завершилась., hint: Увійдіть знову. }
    Forbidden:
      description: Недоступно для вашої ролі
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              code: forbidden,
              message: Ця сторінка недоступна для вашої ролі.,
              hint: Поверніться на головну.,
            }
    NotFound:
      description: Не знайдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Такого запису немає., hint: Перевірте адресу. }
    Conflict:
      description: Дія недоступна в поточному стані
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              code: conflict,
              message: Опубліковану анкету змінити не можна.,
              hint: Створіть нову версію.,
            }
    Invalid:
      description: Дані не пройшли перевірку
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              code: invalid,
              message: Для відхилення потрібна причина.,
              hint: 'Напишіть коротко, чому рекомендацію відхилено.',
            }
  schemas:
    Error:
      type: object
      required: [code, message, hint]
      properties:
        code: { type: string, description: 'Стабільний код для програми.' }
        message: { type: string, description: 'Що сталося, людською мовою.' }
        hint: { type: string, description: 'Що робити далі.' }
    IncompleteError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [missingQuestionIds]
          properties:
            missingQuestionIds:
              type: array
              items: { type: string }
    Role:
      type: string
      enum:
        [
          admin,
          commissioner,
          respondent,
          leader,
          observer,
          checklist_editor,
          checklist_approver,
          auditor,
        ]
      description: |
        admin, commissioner, respondent вирішені командою. leader і observer додано для дашборда,
        checklist_editor і checklist_approver це «вносить» і «підтверджує», auditor читає журнал (узгодити).
    RespondentCategory:
      type: string
      enum: [wg, os, experts]
      description: wg це робоча група, os це особовий склад, experts це експерти.
    ComponentId:
      type: string
      enum: [culture, system, accountability]
    Source:
      type: string
      enum: [wg, os, experts, facts]
    ComponentWeights:
      type: object
      required: [culture, system, accountability]
      properties:
        culture: { type: number }
        system: { type: number }
        accountability: { type: number }
    Session:
      type: object
      required: [role, sections, demo]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        demo: { type: boolean }
        scope: { type: string, example: institution }
        sections:
          type: array
          description: Розділи, доступні ролі (решта не показуються).
          items: { type: string, example: dashboard }
    QuestionnaireStatus:
      type: string
      enum: [draft, published, archived]
    QuestionnaireSummary:
      type: object
      required: [id, title, version, status, respondentCategory]
      properties:
        id: { type: string }
        title: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/QuestionnaireStatus' }
        respondentCategory: { $ref: '#/components/schemas/RespondentCategory' }
    Questionnaire:
      allOf:
        - $ref: '#/components/schemas/QuestionnaireSummary'
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items: { $ref: '#/components/schemas/Question' }
    QuestionInput:
      type: object
      required: [text, component, options]
      properties:
        text: { type: string }
        component: { $ref: '#/components/schemas/ComponentId' }
        respondentCategory: { $ref: '#/components/schemas/RespondentCategory' }
        weight:
          { type: number, description: 'Частка в компоненті, % (узгодити, де живуть ваги питань).' }
        options:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/OptionInput' }
    OptionInput:
      type: object
      required: [text, level, score]
      properties:
        text: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        score: { type: number, description: 'Бал варіанта, 0-100.' }
    Question:
      allOf:
        - $ref: '#/components/schemas/QuestionInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    CycleInput:
      type: object
      required: [period, k, categories]
      properties:
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        k: { type: integer, minimum: 2, default: 5, description: 'Мінімальна група для показу.' }
        categories:
          type: array
          items:
            type: object
            required: [category, weight]
            properties:
              category: { $ref: '#/components/schemas/RespondentCategory' }
              weight: { type: number, description: 'Вага категорії у сприйнятті.' }
        componentWeights: { $ref: '#/components/schemas/ComponentWeights' }
    Cycle:
      allOf:
        - $ref: '#/components/schemas/CycleInput'
        - type: object
          required: [id, status, weightsFrozen]
          properties:
            id: { type: string, example: '2026-11' }
            status: { type: string, enum: [draft, open, closed, published] }
            weightsFrozen: { type: boolean }
            methodologyVersion: { type: string }
    Counters:
      type: object
      required: [cycleId, items]
      properties:
        cycleId: { type: string }
        items:
          type: array
          items:
            type: object
            required: [respondentCategory, issued, used]
            properties:
              respondentCategory: { $ref: '#/components/schemas/RespondentCategory' }
              issued: { type: integer }
              used: { type: integer }
    AssignedSurvey:
      type: object
      required: [assignmentId, title, status, questionCount]
      properties:
        assignmentId: { type: string }
        title: { type: string }
        status: { type: string, enum: [new, in_progress, submitted] }
        questionCount: { type: integer }
        answeredCount: { type: integer }
    SurveyForm:
      type: object
      required: [assignmentId, title, questions]
      properties:
        assignmentId: { type: string }
        title: { type: string }
        guarantees: { type: string, description: 'Текст екрана гарантій анонімності.' }
        questions:
          type: array
          items:
            type: object
            required: [id, text, options]
            properties:
              id: { type: string }
              text: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [id, text]
                  properties:
                    id: { type: string }
                    text: { type: string }
        draft: { $ref: '#/components/schemas/AnswerSet' }
    AnswerSet:
      type: object
      required: [answers]
      description: Лише вибір варіанта. Вільного тексту немає.
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, optionId]
            properties:
              questionId: { type: string }
              optionId: { type: string }
    InstitutionSummary:
      type: object
      required: [id, name, cycle, index, level, trustGrade, delta]
      description: Узагальнена картка закладу. Без позиції, місця чи рангу.
      properties:
        id: { type: string }
        name: { type: string }
        cycle: { type: string }
        index: { type: number }
        level: { type: integer, minimum: 1, maximum: 5 }
        trustGrade: { type: string, enum: [A, B, C, insufficient] }
        delta: { type: number, description: 'Зміна індексу до попереднього циклу, пункти.' }
    DataSource:
      type: object
      required: [id, metric, source, mode, age, explanation]
      properties:
        id: { type: string }
        metric: { type: string }
        source: { type: string }
        mode: { type: string, enum: [auto, manual, planned, approval] }
        age: { type: string, description: 'Вік даних простою мовою.' }
        explanation: { type: string }
    Integration:
      type: object
      required: [id, system, purpose, method, mode]
      properties:
        id: { type: string }
        system: { type: string }
        purpose: { type: string }
        method: { type: string }
        mode: { type: string, enum: [auto, manual, planned, approval] }
    Unit:
      type: object
      required: [id, name, parentId]
      description: Вузол дерева підрозділів. Корінь має parentId null. Назви нейтральні, глибина довільна.
      properties:
        id: { type: string, example: unit-a }
        name: { type: string, example: Підрозділ А }
        parentId: { type: [string, 'null'], example: alpha }
    HiddenBelowK:
      type: object
      required: [visibility, message, fallbackScope]
      properties:
        visibility: { type: string, enum: [hidden_below_k] }
        message: { type: string }
        fallbackScope:
          {
            $ref: '#/components/schemas/Unit',
            description: 'Батьківський підрозділ (рівень вище), дані якого можна показати.',
          }
    TrustFlag:
      type: object
      required: [id, weight, raised, title, explanation]
      properties:
        id: { type: string }
        weight:
          {
            type: string,
            enum: [minor, major],
            description: 'minor це незначний, major це серйозний.',
          }
        raised: { type: boolean, description: 'Так чи ні.' }
        title: { type: string }
        explanation: { type: string, description: 'Пояснення простою мовою.' }
    Trust:
      type: object
      required: [grade, word, flags]
      properties:
        grade:
          type: string
          enum: [A, B, C, insufficient]
          description: |
            A жоден прапорець; B лише 1-2 незначних; C хоча б один серйозний або 3 і більше незначних;
            insufficient якщо відповідей у групі менше k.
        word:
          {
            type: string,
            description: 'підтверджується, є зауваження, потрібна перевірка або недостатньо даних.',
          }
        responses: { type: integer }
        flags:
          type: array
          items: { $ref: '#/components/schemas/TrustFlag' }
    ComponentResult:
      type: object
      required: [id, label, perception, facts, credited, limited]
      properties:
        id: { $ref: '#/components/schemas/ComponentId' }
        label: { type: string }
        perception: { type: number }
        facts: { type: number }
        credited: { type: number }
        limited: { type: boolean }
        limiterReason: { type: string }
        previousCredited: { type: [number, 'null'] }
    Insight:
      type: object
      required: [id, title, value]
      properties:
        id: { type: string }
        title: { type: string }
        value: { type: number }
        component: { $ref: '#/components/schemas/ComponentId' }
    Dashboard:
      type: object
      required: [scope, cycle, index, summary, components, trust, strengths, attention, conclusion]
      properties:
        scope: { type: string }
        institution: { type: string }
        cycle:
          type: object
          properties:
            id: { type: string }
            date: { type: string, format: date }
        index:
          type: object
          required: [value, level, levelName]
          properties:
            value: { type: number, minimum: 0, maximum: 100 }
            level: { type: integer, minimum: 1, maximum: 5 }
            levelName: { type: string }
            previousValue: { type: [number, 'null'] }
            delta: { type: [number, 'null'] }
        summary:
          type: object
          properties:
            text: { type: string }
            reason: { type: string }
        components:
          type: array
          items: { $ref: '#/components/schemas/ComponentResult' }
        trust: { $ref: '#/components/schemas/Trust' }
        strengths:
          type: array
          items: { $ref: '#/components/schemas/Insight' }
        attention:
          type: array
          items: { $ref: '#/components/schemas/Insight' }
        conclusion: { type: string }
    BreakdownNode:
      type: object
      required: [id, kind, label, weight, value, contribution]
      properties:
        id: { type: string }
        kind: { type: string, enum: [index, component, item] }
        label: { type: string }
        weight: { type: number, description: 'Вага в батьківському вузлі, %.' }
        value: { type: number }
        contribution: { type: number, description: 'Внесок в індекс, пункти.' }
        source: { $ref: '#/components/schemas/Source' }
        limited: { type: boolean }
        limiterReason: { type: string }
        hint: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/BreakdownNode' }
    Breakdown:
      type: object
      required: [mode, root, sumCheck]
      properties:
        mode: { type: string, enum: [perception, facts, credited] }
        root: { $ref: '#/components/schemas/BreakdownNode' }
        sumCheck:
          type: object
          required: [sum, indexValue, matches]
          properties:
            sum: { type: number }
            indexValue: { type: number }
            matches: { type: boolean }
    Compare:
      type: object
      required: [components]
      properties:
        components:
          type: array
          items:
            type: object
            required: [id, bars]
            properties:
              id: { $ref: '#/components/schemas/ComponentId' }
              explanation: { type: string, description: 'Розбіжності текстом.' }
              bars:
                type: array
                items:
                  type: object
                  required: [source]
                  properties:
                    source: { $ref: '#/components/schemas/Source' }
                    value: { type: [number, 'null'] }
                    visibility: { type: string, enum: [visible, hidden_below_k] }
    TrendPoint:
      type: object
      required: [cycle, date, index]
      properties:
        cycle: { type: string }
        date: { type: string, format: date, description: 'Дата циклу.' }
        index: { type: number }
        components:
          {
            $ref: '#/components/schemas/ComponentWeights',
            description: 'Зараховані значення компонентів, 0-100.',
          }
    Trends:
      type: object
      required: [points]
      properties:
        period:
          type: object
          properties:
            from: { type: string }
            to: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
        comparePeriod:
          type: object
          description: Лише при compare=periods.
          properties:
            from: { type: string }
            to: { type: string }
        comparePoints:
          type: array
          description: Цикли другого періоду (лише при compare=periods).
          items: { $ref: '#/components/schemas/TrendPoint' }
        delta:
          type: object
          description: Різниця середніх значень другого періоду й першого, у пунктах (лише при compare=periods).
          properties:
            index: { type: number }
            components: { $ref: '#/components/schemas/ComponentWeights' }
        events:
          type: array
          items:
            type: object
            properties:
              cycle: { type: string }
              title: { type: string }
              measureId: { type: string }
    FactMetric:
      type: object
      required: [id, component, label, kind, mode]
      properties:
        id: { type: string }
        component: { $ref: '#/components/schemas/ComponentId' }
        label: { type: string }
        kind: { type: string, enum: [percent, level] }
        value:
          { type: [number, 'null'], description: 'Значення 0-100 (для percent дорівнює percent).' }
        numerator:
          {
            type: [integer, 'null'],
            description: 'Скільки відповідає умові (лише percent). Без імен.',
          }
        denominator: { type: [integer, 'null'], description: 'З скількох (лише percent).' }
        percent: { type: [number, 'null'], description: 'Відсоток 0-100: numerator / denominator.' }
        source: { type: string, description: 'Звідки дані (система або реєстр).' }
        mode:
          {
            type: string,
            enum: [automatic, manual, planned],
            description: 'automatic це автоматично, manual це ручний ввід, planned це планується.',
          }
        asOf: { type: [string, 'null'], format: date-time }
        ageDays: { type: [integer, 'null'], description: 'Вік даних у днях.' }
    ChecklistItem:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [open, awaiting_confirmation, confirmed] }
        evidenceUrl: { type: [string, 'null'] }
        enteredBy:
          {
            type: [string, 'null'],
            description: 'Посада або роль того, хто вніс (узгодити, чи потрібне імʼя).',
          }
        confirmedBy:
          {
            type: [string, 'null'],
            description: 'Посада або роль того, хто підтвердив; інша особа, ніж enteredBy.',
          }
    ChecklistSection:
      type: object
      required: [id, title, items]
      properties:
        id: { type: string }
        title: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
    RecommendationStatus:
      type: string
      enum: [proposed, accepted, clarified, rejected]
    Recommendation:
      type: object
      required: [id, title, priority, status, basis]
      properties:
        id: { type: string }
        title: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        status: { $ref: '#/components/schemas/RecommendationStatus' }
        actions:
          type: array
          items: { type: string }
        basis:
          type: array
          description: 'Блок «На підставі»: які агрегати й показники спричинили рекомендацію (без окремих відповідей).'
          items:
            type: object
            properties:
              nodeId: { type: string, description: 'Вузол розкладу індексу.' }
              text: { type: string }
              value: { type: number }
        rejectionReason: { type: [string, 'null'] }
    MeasureStatus:
      type: string
      enum: [accepted, inprogress, done, confirmed, notconfirmed, overdue]
    Measure:
      type: object
      required: [id, title, assignee, dueDate, status]
      properties:
        id: { type: string }
        recommendationId: { type: string }
        title: { type: string }
        assignee: { type: string, description: 'Посада або роль відповідального.' }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/MeasureStatus' }
        verifiedInCycle:
          { type: [string, 'null'], description: 'Цикл, у якому захід верифіковано.' }
        verification:
          type: [string, 'null']
          enum: ['Підтверджено наступним оцінюванням', 'Не підтверджено, потрібен перегляд', null]
          description: Результат верифікації наступним циклом. Для відкритого заходу null.
        overdueDays:
          {
            type: integer,
            minimum: 0,
            description: 'Скільки днів прострочено на дату запиту, 0 якщо ні.',
          }
    MyResults:
      type: object
      required: [scope, cycle, index, components]
      properties:
        scope: { type: string }
        cycle: { type: string }
        index: { type: number }
        level: { type: integer }
        components:
          type: array
          items: { $ref: '#/components/schemas/ComponentResult' }
        doneSinceLastCycle:
          type: array
          items: { type: string }
        next:
          type: array
          items: { type: string }
    Report:
      type: object
      required: [id, cycle, methodology]
      properties:
        id: { type: string }
        cycle: { type: string }
        generatedAt: { type: string, format: date-time }
        methodology:
          type: object
          required: [version, hash]
          properties:
            version: { type: string }
            hash: { type: string }
        sections:
          type: array
          description: 'Структура додатка Г: затвердження, підстава, методика, таблиці, висновок.'
          items:
            type: object
            properties:
              title: { type: string }
              body: { type: string }
    AuditEntry:
      type: object
      required: [id, at, event, role]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        event: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        details: { type: string, description: 'Без відповідей респондентів.' }
    Methodology:
      type: object
      required: [version, hash, componentWeights]
      properties:
        version: { type: string }
        hash: { type: string }
        componentWeights: { $ref: '#/components/schemas/ComponentWeights' }
        levelUpperBounds:
