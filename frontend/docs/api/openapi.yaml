openapi: 3.1.0
info:
  title: API платформи оцінювання доброчесності (пропозиція фронтенду)
  version: 0.1.0-proposal
  summary: Пропозиція контракту для узгодження з бекендом
  description: |
    Це пропозиція фронтенду, а не остаточне рішення. Усе, що позначено «узгодити», потребує підтвердження бекенду.

    **Загальне**
    - База: `/api/v1`. Формат: JSON. Дати й час: ISO 8601 (`2026-11-16T09:30:00Z`, дата без часу `2026-11-16`).
    - Усі id це рядки. Числа індексу 0-100, рівні зрілості 1-5.
    - Помилки мають вигляд `{code, message, hint}`: `message` і `hint` людськими текстами українською.
    - Анкети версійні: опублікована версія не змінюється, зміни роблять новою версією.
    - Кожен запит має поле `x-roles` (ролі, яким він доступний). Решта ролей отримують 403.

    **Ролі.** `admin`, `commissioner`, `respondent`. Далі додадуться «вносить» і «підтверджує» для чек-листа
    (тут умовно `checklist_editor`, `checklist_approver`, узгодити). Для дашборда додано `leader` і `observer` (узгодити).

    **Три шари результату.** Самооцінка (сприйняття з анкет), факти (відсотки й рівні), достовірність (літера
    A/B/C або «недостатньо даних»). Індекс 0-100 зі шкали 1-5, середнє Культура, Система, Підзвітність, із обмежувачем
    «зараховане = min(сприйняття, факти + 25)».

    **Анонімність.** Див. розділ «Інваріанти» нижче.
  x-invariants:
    - Жоден запит не повертає окремі відповіді респондентів.
    - Групи менші за k (за замовчуванням 10, налаштовується) ніколи не повертаються (стан hidden_below_k, дані малої групи додаються до батьківського підрозділу).
    - Ролі admin і commissioner не мають доступу до відповідей.
    - Роль commissioner не бачить, хто і скільки пройшов.
    - Немає запитів з іменними рейтингами людей чи підрозділів.
servers:
  - url: /api/v1
    description: Відносно хоста застосунку
security:
  - bearerAuth: []
tags:
  - name: session
    description: (a) Сесія і демо-перемикання ролей
  - name: questionnaires
    description: (b) Анкети (commissioner)
  - name: cycles
    description: (c) Цикли і розсилка (admin)
  - name: survey
    description: (d) Проходження анкет (respondent)
  - name: dashboard
    description: (e) Дашборд
  - name: explain
    description: (f) Розклад індексу
  - name: analytics
    description: (g) Порівняння і динаміка
  - name: facts
    description: (h) Факти
  - name: checklist
    description: (i) Чек-лист
  - name: recommendations
    description: (j) Рекомендації і заходи
  - name: me
    description: (k) Екран учасника
  - name: reports
    description: (l) Звіти, журнал, методологія
  - name: invariants
    description: |
      Інваріанти (обовʼязкові для всіх запитів):
      1. Жоден запит не повертає окремі відповіді респондентів. Відповіді зберігаються й віддаються лише агрегатами.
      2. Групи менші за k ніколи не повертаються (k за замовчуванням 10, налаштовується адміністратором циклу): замість даних приходить `{visibility: "hidden_below_k", fallbackScope}`, де `fallbackScope` це батьківський підрозділ, дані якого можна показати.
      3. admin і commissioner не мають доступу до відповідей, навіть узагальнених за малою групою.
      4. commissioner не бачить прогрес проходження (хто і скільки пройшли). Лічильники «видано/використано» бачить лише admin і без осіб.
      5. Немає запитів з іменними рейтингами людей чи підрозділів.
      6. Відправлення анкети не повертає і не зберігає ідентифікатор людини разом із відповідями.
paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Поточна сесія і доступні розділи
      x-roles: [admin, commissioner, respondent, leader, observer]
      responses:
        '200':
          description: Сесія
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [session]
      operationId: createSession
      summary: Вхід
      description: У демо вхід за роллю без пароля; у проді механізм входу узгодити.
      security: []
      x-roles: [anonymous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Сесія створена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [session]
      operationId: deleteSession
      summary: Вихід
      x-roles: [admin, commissioner, respondent, leader, observer]
      responses:
        '204': { description: Сесію завершено }
  /demo/role:
    put:
      tags: [session]
      operationId: switchDemoRole
      summary: Перемкнути роль (лише в демо)
      description: Доступно лише коли сервер запущено в демо-режимі. Скидає scope до значення за замовчуванням для ролі.
      x-roles: [demo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Роль перемкнуто
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }
  /questionnaires:
    get:
      tags: [questionnaires]
      operationId: listQuestionnaires
      summary: Список анкет
      x-roles: [commissioner]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QuestionnaireStatus' }
      responses:
        '200':
          description: Анкети
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionnaireSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [questionnaires]
      operationId: createQuestionnaire
      summary: Створити чернетку анкети
      x-roles: [commissioner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, respondentCategory]
              properties:
                title: { type: string }
                respondentCategory: { $ref: '#/components/schemas/RespondentCategory' }
      responses:
        '201':
          description: Чернетку створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /questionnaires/{questionnaireId}:
    parameters:
      - $ref: '#/components/parameters/QuestionnaireId'
    get:
      tags: [questionnaires]
      operationId: getQuestionnaire
      summary: Анкета з питаннями
      x-roles: [commissioner]
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [questionnaires]
      operationId: updateQuestionnaire
      summary: Змінити назву чернетки
      x-roles: [commissioner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        '200':
          description: Оновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '409': { $ref: '#/components/responses/Conflict' }
  /questionnaires/{questionnaireId}/questions:
    parameters:
      - $ref: '#/components/parameters/QuestionnaireId'
    put:
      tags: [questionnaires]
      operationId: replaceQuestions
      summary: Замінити перелік питань чернетки
      description: |
        Лише для чернетки. Кожне питання має рівно 5 варіантів, кожен варіант це рівень 1-5 і бал.
        Вільного тексту у відповідях немає. Питання привʼязане до компонента й категорії респондента.
      x-roles: [commissioner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  items: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '200':
          description: Питання збережено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /questionnaires/{questionnaireId}/publish:
    parameters:
      - $ref: '#/components/parameters/QuestionnaireId'
    post:
      tags: [questionnaires]
      operationId: publishQuestionnaire
      summary: Опублікувати анкету
      description: Після публікації версію змінити не можна, лише створити нову.
      x-roles: [commissioner]
      responses:
        '200':
          description: Опубліковано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /questionnaires/{questionnaireId}/versions:
    parameters:
      - $ref: '#/components/parameters/QuestionnaireId'
    post:
      tags: [questionnaires]
      operationId: createQuestionnaireVersion
      summary: Створити нову версію (чернетку) з опублікованої
      x-roles: [commissioner]
      responses:
        '201':
          description: Нову версію створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '409': { $ref: '#/components/responses/Conflict' }
  /questionnaires/{questionnaireId}/archive:
    parameters:
      - $ref: '#/components/parameters/QuestionnaireId'
    post:
      tags: [questionnaires]
      operationId: archiveQuestionnaire
      summary: Архівувати анкету
      x-roles: [commissioner]
      responses:
        '200':
          description: Архівовано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Questionnaire' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cycles:
    get:
      tags: [cycles]
      operationId: listCycles
      summary: Цикли оцінювання
      x-roles: [admin, leader, observer, commissioner]
      responses:
        '200':
          description: Цикли
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Cycle' }
    post:
      tags: [cycles]
      operationId: createCycle
      summary: Створити цикл
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CycleInput' }
      responses:
        '201':
          description: Цикл створено (статус draft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cycle' }
        '422': { $ref: '#/components/responses/Invalid' }
  /cycles/{cycleId}:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    get:
      tags: [cycles]
      operationId: getCycle
      summary: Цикл
      x-roles: [admin, leader, observer, commissioner]
      responses:
        '200':
          description: Цикл
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cycle' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [cycles]
      operationId: updateCycle
      summary: Змінити цикл
      description: Ваги, k і категорії можна змінювати лише до відкриття, потім вони заморожені (409).
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CycleInput' }
      responses:
        '200':
          description: Оновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cycle' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cycles/{cycleId}/assignments:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    put:
      tags: [cycles]
      operationId: assignQuestionnaires
      summary: Призначити анкети категоріям респондентів
      description: Призначення робиться за категоріями й групами, не за іменами. Видача респондентам відбувається при відкритті.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [questionnaireId, respondentCategory]
                    properties:
                      questionnaireId: { type: string }
                      respondentCategory: { $ref: '#/components/schemas/RespondentCategory' }
      responses:
        '200': { description: Призначено }
        '409': { $ref: '#/components/responses/Conflict' }
  /cycles/{cycleId}/open:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    post:
      tags: [cycles]
      operationId: openCycle
      summary: Відкрити цикл
      description: Ваги методики заморожуються. Анкети стають доступні респондентам.
      x-roles: [admin]
      responses:
        '200':
          description: Відкрито
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cycle' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cycles/{cycleId}/close:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    post:
      tags: [cycles]
      operationId: closeCycle
      summary: Завершити цикл
      x-roles: [admin]
      responses:
        '200':
          description: Завершено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cycle' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cycles/{cycleId}/publish:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    post:
      tags: [cycles]
      operationId: publishCycle
      summary: Опублікувати результати циклу
      x-roles: [admin]
      responses:
        '200':
          description: Опубліковано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cycle' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cycles/{cycleId}/counters:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    get:
      tags: [cycles]
      operationId: getCycleCounters
      summary: Лічильники «видано/використано»
      description: Лише кількості за категоріями, без осіб. Недоступно ролі commissioner.
      x-roles: [admin]
      responses:
        '200':
          description: Лічильники
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Counters' }
              example:
                cycleId: '2026-11'
                items:
                  - respondentCategory: wg
                    issued: 12
                    used: 11
                  - respondentCategory: os
                    issued: 120
                    used: 83
                  - respondentCategory: experts
                    issued: 5
                    used: 5
        '403': { $ref: '#/components/responses/Forbidden' }
  /my/surveys:
    get:
      tags: [survey]
      operationId: listMySurveys
      summary: Призначені мені анкети
      x-roles: [respondent]
      responses:
        '200':
          description: Анкети
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AssignedSurvey' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /my/surveys/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [survey]
      operationId: getMySurvey
      summary: Отримати анкету для проходження
      description: Повертає питання й варіанти. Проміжні відповіді повертаються лише самому респонденту.
      x-roles: [respondent]
      responses:
        '200':
          description: Анкета
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyForm' }
        '404': { $ref: '#/components/responses/NotFound' }
  /my/surveys/{assignmentId}/draft:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    put:
      tags: [survey]
      operationId: saveSurveyDraft
      summary: Зберегти проміжні відповіді
      x-roles: [respondent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSet' }
      responses:
        '200':
          description: Збережено
          content:
            application/json:
              schema:
                type: object
                properties:
                  answered: { type: integer, example: 7 }
                  total: { type: integer, example: 12 }
        '409': { $ref: '#/components/responses/Conflict' }
  /my/surveys/{assignmentId}/submit:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [survey]
      operationId: submitSurvey
      summary: Відправити анкету з перевіркою повноти
      description: |
        Якщо відповіді неповні, повертається 422 з переліком питань без відповіді. Після прийняття відповіді
        записуються окремо від особи (без звʼязку з респондентом), а призначення позначається використаним.
        Відповідь не містить ідентифікатора людини.
      x-roles: [respondent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSet' }
      responses:
        '200':
          description: Прийнято
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, enum: [accepted] }
                  message: { type: string, example: Дякуємо. Ваші відповіді прийнято анонімно. }
        '422':
          description: Анкета неповна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncompleteError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /units:
    get:
      tags: [dashboard]
      operationId: listUnits
      summary: Дерево підрозділів
      description: Плоский список вузлів дерева (id, name, parentId), доступних ролі. Кількості відповідей не повертаються.
      x-roles: [leader, observer, admin, auditor]
      responses:
        '200':
          description: Вузли
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Unit' }
              example:
                items:
                  - { id: alpha, name: 'Умовний військовий інститут «Альфа»', parentId: null }
                  - { id: unit-a, name: Підрозділ А, parentId: alpha }
                  - { id: unit-b, name: Підрозділ Б, parentId: alpha }
                  - { id: unit-v, name: Підрозділ В, parentId: alpha }
  /institutions:
    get:
      tags: [dashboard]
      operationId: listInstitutions
      summary: Заклади для спостерігача
      description: |
        Узагальнені дані закладів. Єдине сортування це за назвою (алфавітний порядок). Параметрів сортування за
        індексом чи іншими показниками немає, позицій і місць у відповіді немає: заклади не порівнюються й не
        ранжуються. Після вибору закладу решта запитів приймає його id у параметрі `scope`.
      x-roles: [observer]
      responses:
        '200':
          description: Заклади за назвою
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InstitutionSummary' }
              example:
                items:
                  - {
                      id: gamma,
                      name: 'Умовна академія «Гамма»',
                      cycle: '2026-11',
                      index: 68.5,
                      level: 4,
                      trustGrade: A,
                      delta: 5.2,
                    }
  /data-sources:
    get:
      tags: [reports]
      operationId: listDataSources
      summary: Звідки беруться дані
      description: Метрики, джерела, режим отримання й вік даних. Статуси чесні, без обіцянок наперед.
      x-roles: [leader, observer, auditor]
      responses:
