# Фронтенд + зворотний проксі до API. Шаблон: при старті контейнера підставляється ${BACKEND_URL}.
# Один origin для сторінок і /api, тому CORS у браузері не задіяний.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Найбільший легітимний запит — файл-доказ (EVIDENCE_MAX_BYTES, за замовчуванням 10 МБ).
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Закритий контур: жодних зовнішніх джерел. Хеш вбудованого скрипта теми рахується під час збірки.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Заголовки входу через проксі організації не можна передати з браузера: стираємо.
        # Якщо SSO стоїть перед цим nginx, задайте їх тут явно з його змінних.
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Proxy-Secret "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass ${BACKEND_URL}/health;
        access_log off;
    }

    # Одноразові посилання /s/<токен>: не пишемо в журнал nginx, щоб токен не лишався в логах.
    # index.html віддається тут же (без внутрішнього переходу), тож access_log off діє.
    location /s/ {
        access_log off;
        try_files /index.html =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
